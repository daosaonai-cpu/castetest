<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Camera App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a1a2e;
            color: #e0e0e0;
            overflow: hidden; /* Prevent scrolling when interacting with camera */
            touch-action: none; /* Prevent pinch zoom etc on mobile */
        }
        .pixel-font {
            font-family: 'Press Start 2P', cursive;
        }
        
        /* Main camera container */
        #camera-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Hidden video element for source */
        #video-source {
            display: none;
        }

        /* The canvas where filters are applied */
        #output-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* UI Overlay */
        #ui-layer {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            pointer-events: none; /* Let clicks pass through to background if needed, specific UI elements will have pointer-events: auto */
        }

        .ui-element {
            pointer-events: auto;
        }

        /* Camera Selection Carousel */
        #camera-selector {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            overflow-x: auto;
            scrollbar-width: none; /* Firefox */
            scroll-behavior: smooth;
        }
        #camera-selector::-webkit-scrollbar {
            display: none; /* Safari and Chrome */
        }

        .camera-option {
            flex: 0 0 auto;
            width: 80px;
            opacity: 0.5;
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        
        .camera-option.active {
            opacity: 1;
            transform: scale(1.1);
        }

        .camera-icon-placeholder {
            width: 50px;
            height: 35px;
            background-color: #333;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            border: 2px solid #555;
            position: relative;
        }
        
        .camera-option.active .camera-icon-placeholder {
            border-color: #fbbf24; /* Amber-400 */
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.5);
        }

        /* Lens representation inside placeholder */
        .camera-icon-placeholder::after {
            content: '';
            width: 15px;
            height: 15px;
            background: #111;
            border-radius: 50%;
            border: 2px solid #666;
        }

        /* Capture Button */
        #capture-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.8);
            border: 4px solid #fff;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        #capture-btn:active {
            transform: scale(0.9);
            background-color: rgba(200, 200, 200, 0.8);
        }

        /* Camera Info Display */
        #camera-info {
            text-shadow: 1px 1px 2px black;
        }

        /* Flash screen effect */
        #flash-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: white;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-out;
        }

        /* Snapshot preview */
        #preview-container {
            position: absolute;
            bottom: 90px;
            right: 20px;
            width: 60px;
            height: 80px;
            border: 2px solid white;
            border-radius: 4px;
            background-color: #333;
            z-index: 10;
            display: none; /* Hidden initially */
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            pointer-events: auto;
        }
        
        #preview-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Fullscreen view for captured image */
        #fullscreen-view {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0,0,0,0.9);
            z-index: 30;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }

        #fullscreen-img {
            max-width: 90%;
            max-height: 80%;
            object-fit: contain;
            border: 10px solid white; /* Polaroid style border */
            border-bottom-width: 40px;
            background-color: white;
        }

        /* Error/Permission Message */
        #message-box {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 30, 0.9);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #444;
            z-index: 50;
            text-align: center;
            max-width: 80%;
        }

    </style>
</head>
<body>

    <div id="camera-container">
        <!-- Hidden video element to get camera feed -->
        <video id="video-source" autoplay playsinline></video>
        
        <!-- Canvas to draw and filter the video feed -->
        <canvas id="output-canvas"></canvas>

        <!-- Flash effect layer -->
        <div id="flash-screen"></div>

        <!-- UI Layer -->
        <div id="ui-layer">
            
            <!-- Top Bar: Camera Selector -->
            <div id="camera-selector" class="ui-element flex px-4 py-3 gap-6">
                <!-- Camera options injected via JS -->
            </div>

            <!-- Middle: Camera Info -->
            <div class="px-6 py-4 flex-grow flex flex-col justify-start mt-4 pointer-events-none">
                <div class="flex items-center gap-2 mb-2">
                    <span class="pixel-font text-xl text-white" id="info-name">> DISPO F <</span>
                    <span class="text-xl" id="info-crown">👑</span>
                </div>
                <div class="pixel-font text-xs text-gray-300 mb-4" id="info-tags">
                    [Disposable Camera] [Grain] [Warm]
                </div>
                <!-- Optional: short description if space permits, hidden on very small screens -->
                <div class="pixel-font text-[10px] text-gray-200 leading-relaxed max-w-md hidden sm:block opacity-80" id="info-desc">
                    Inspired by disposable film cameras...
                </div>
            </div>

            <!-- Bottom Bar: Controls -->
            <div class="ui-element flex justify-center items-center pb-8 pt-4 bg-gradient-to-t from-black/80 to-transparent">
                <!-- Switch Camera Button (Front/Back) -->
                <button id="switch-cam-btn" class="absolute left-8 p-3 bg-black/50 rounded-full text-white hover:bg-black/70">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/></svg>
                </button>

                <!-- Main Capture Button -->
                <button id="capture-btn" aria-label="Take Photo"></button>

                <!-- Sub-filters (if applicable for the selected camera) -->
                <div id="sub-filter-container" class="absolute right-8 flex flex-col gap-2 hidden">
                    <!-- e.g., for ACTION camera: CC, NC, etc. -->
                </div>
            </div>

            <!-- Mini Preview of last captured photo -->
            <div id="preview-container" class="ui-element">
                <img id="preview-img" src="" alt="Preview">
            </div>
        </div>
    </div>

    <!-- Fullscreen view for saving/closing -->
    <div id="fullscreen-view">
        <div class="flex justify-between w-full px-6 py-4 absolute top-0">
            <button id="close-fullscreen" class="text-white bg-black/50 p-2 rounded-full pixel-font text-xs">X CLOSE</button>
            <button id="save-photo" class="text-white bg-blue-600/80 px-4 py-2 rounded pixel-font text-xs hover:bg-blue-500">SAVE</button>
        </div>
        <img id="fullscreen-img" src="" alt="Captured Photo">
    </div>

    <!-- Error Messages -->
    <div id="message-box">
        <p id="message-text" class="mb-4 pixel-font text-xs leading-5">Message here</p>
        <button id="close-message" class="bg-gray-700 px-4 py-2 rounded text-white text-sm">OK</button>
    </div>

    <script>
        // Data structure for camera types based on the provided images
        const cameras = [
            {
                id: 'dispo_f',
                name: 'DISPO F',
                tags: '[Disposable Camera] [Grain] [Warm]',
                desc: 'Inspired by disposable film cameras. Features rough color noise enhancing retro film texture. Yellow-green and brown-red color shifts.',
                iconColor: '#2dd4bf', // Teal-ish placeholder
                hasSubFilters: true,
                subFilters: ['+* 01', '+* 02'], // Fake sub-filters for UI
                process: (ctx, canvas, width, height, time) => {
                    // DISPO F Effect: Warm/Greenish tint, High Contrast, Heavy Grain
                    
                    // 1. Basic CSS filter equivalent (brightness, contrast, sepia)
                    ctx.filter = 'contrast(1.2) brightness(1.05) sepia(0.3) hue-rotate(-10deg) saturate(1.2)';
                    
                    // We need to draw the video first if using ctx.filter (handled in main loop)
                    // Then apply manual pixel manipulation for noise if needed, or use a composite trick.
                    
                    // To do real film grain performantly in JS canvas without WebGL is tricky on full res.
                    // We will overlay a generated noise pattern.
                },
                postProcess: (ctx, width, height) => {
                    // Overlay Noise
                    drawNoise(ctx, width, height, 0.15, 'rgba(100, 100, 50, 0.1)'); // Greenish-warm noise
                    applyVignette(ctx, width, height, 0.6, 1.0);
                }
            },
            {
                id: 'z50',
                name: 'Z50',
                tags: '[Soft light] [Portrait] [Matte]',
                desc: 'Inspired by Casio Z50. Excellent soft light effects with a matte feel, clear bright images with lower color saturation.',
                iconColor: '#db2777', // Pink-ish
                process: (ctx) => {
                    // Z50 Effect: Soft, slightly overexposed, desaturated, matte (lowered blacks)
                    ctx.filter = 'brightness(1.15) contrast(0.9) saturate(0.8) blur(0.5px)';
                },
                postProcess: (ctx, width, height) => {
                    // Matte effect: wash out blacks slightly by overlaying a very faint white layer
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                    ctx.fillRect(0, 0, width, height);
                }
            },
            {
                id: 'action',
                name: 'ACTION',
                tags: '[High-quality] [Delicate] [Daily]',
                desc: 'Cinematic quality. Fuji CC (soft & delicate).',
                iconColor: '#4b5563', // Gray
                process: (ctx) => {
                    // Fuji CC Style: Slightly cool shadows, warm highlights, desaturated, soft contrast
                    ctx.filter = 'contrast(0.95) saturate(0.85) sepia(0.1) hue-rotate(5deg)';
                },
                postProcess: (ctx, width, height) => {
                    // Cyan/Blue tint in shadows (simulated simply here)
                    ctx.fillStyle = 'rgba(0, 50, 100, 0.05)';
                    ctx.globalCompositeOperation = 'overlay';
                    ctx.fillRect(0, 0, width, height);
                    ctx.globalCompositeOperation = 'source-over';
                }
            },
            {
                id: 'booth',
                name: 'BOOTH',
                tags: '[Photo booth] [Portrait] [4 Cuts]',
                desc: 'American retro photo booth. Antique bronze and color effects.',
                iconColor: '#b45309', // Wood/Bronze color
                process: (ctx) => {
                    // Booth Effect: Warm, vintage, sepia heavy
                    ctx.filter = 'sepia(0.6) contrast(1.1) brightness(0.9) saturate(1.2)';
                },
                postProcess: (ctx, width, height) => {
                    applyVignette(ctx, width, height, 0.4, 0.9);
                    // Add slight vertical streaks/scratches for booth feel
                    drawScratches(ctx, width, height, 3, 0.05);
                }
            },
            {
                id: 'bigshot',
                name: 'BIGSHOT',
                tags: '[Packfilm] [Portrait] [Vintage]',
                desc: 'Polaroid Big Shot pack film camera. Vintage filters and films.',
                iconColor: '#d1d5db', // Light gray/silver
                process: (ctx) => {
                    // Packfilm: Faded, low contrast, slight color shifts (magenta/green)
                    ctx.filter = 'contrast(0.8) brightness(1.1) sepia(0.2) hue-rotate(-20deg) saturate(0.7)';
                },
                postProcess: (ctx, width, height) => {
                    drawNoise(ctx, width, height, 0.1);
                    // Light leak effect
                    drawLightLeak(ctx, width, height, 'left', 'rgba(255, 100, 0, 0.15)');
                }
            },
            {
                id: 'nx',
                name: 'NX',
                tags: '[Dreamcore] [Soft Light] [Scenery]',
                desc: 'Refreshing color palette, high exposure, ethereal luminescence. Dreamlike atmosphere.',
                iconColor: '#5eead4', // Light teal/cyan
                process: (ctx) => {
                    // Dreamcore: High exposure, bloom (blur), cyan/blue shift, high saturation
                    ctx.filter = 'brightness(1.2) contrast(0.9) saturate(1.4) hue-rotate(15deg)';
                },
                postProcess: (ctx, width, height) => {
                    // Soft glow effect (simulated by drawing a scaled up, blurred version over itself with screen)
                    // Too expensive to do full bloom in real-time on basic canvas easily without WebGL, 
                    // so we use a simple white overlay and strong CSS filters.
                    ctx.fillStyle = 'rgba(200, 255, 255, 0.1)';
                    ctx.globalCompositeOperation = 'screen';
                    ctx.fillRect(0, 0, width, height);
                    ctx.globalCompositeOperation = 'source-over';
                }
            },
            {
                id: 'inst_e',
                name: 'INST E',
                tags: '[Polaroid] [Daily] [Retro]',
                desc: 'Digital instant camera. Capturing everyday memories.',
                iconColor: '#9a3412', // Brown leather
                process: (ctx) => {
                    // Instax style: Blown highlights, crushed blacks, slight cool/magenta tint, soft
                    ctx.filter = 'contrast(1.2) brightness(1.1) saturate(0.9) sepia(0.15)';
                },
                postProcess: (ctx, width, height) => {
                    applyVignette(ctx, width, height, 0.5, 0.8);
                    // Wash out edges slightly more (polaroid fade)
                    ctx.fillStyle = 'rgba(255, 250, 240, 0.05)';
                    ctx.fillRect(0, 0, width, height);
                }
            }
        ];

        let currentCameraIndex = 0;
        let videoStream = null;
        let useFrontCamera = false; // Default back camera
        
        // DOM Elements
        const videoElement = document.getElementById('video-source');
        const canvasElement = document.getElementById('output-canvas');
        const ctx = canvasElement.getContext('2d', { willReadFrequently: true });
        const cameraSelector = document.getElementById('camera-selector');
        
        const infoName = document.getElementById('info-name');
        const infoTags = document.getElementById('info-tags');
        const infoDesc = document.getElementById('info-desc');
        
        const captureBtn = document.getElementById('capture-btn');
        const switchCamBtn = document.getElementById('switch-cam-btn');
        const flashScreen = document.getElementById('flash-screen');
        
        const previewContainer = document.getElementById('preview-container');
        const previewImg = document.getElementById('preview-img');
        
        const fullscreenView = document.getElementById('fullscreen-view');
        const fullscreenImg = document.getElementById('fullscreen-img');
        const closeFullscreenBtn = document.getElementById('close-fullscreen');
        const savePhotoBtn = document.getElementById('save-photo');

        const messageBox = document.getElementById('message-box');
        const messageText = document.getElementById('message-text');
        const closeMessageBtn = document.getElementById('close-message');

        let animationFrameId;
        let lastFrameTime = 0;
        const targetFPS = 30;
        const frameInterval = 1000 / targetFPS;

        
        // 1. Initialize UI (Camera Carousel)
        function initUI() {
            cameras.forEach((cam, index) => {
                const opt = document.createElement('div');
                opt.className = `camera-option ${index === currentCameraIndex ? 'active' : ''}`;
                opt.dataset.index = index;
                
                opt.innerHTML = `
                    <div class="camera-icon-placeholder" style="background-color: ${cam.iconColor}">
                        <div style="position:absolute; top:2px; left:2px; font-size:6px; color:white;">PROC</div>
                    </div>
                    <span class="pixel-font text-[8px] text-center mt-1 text-white">${cam.name}</span>
                `;
                
                opt.addEventListener('click', () => selectCamera(index));
                cameraSelector.appendChild(opt);
            });
            updateCameraInfo();
        }

        function selectCamera(index) {
            const options = document.querySelectorAll('.camera-option');
            options[currentCameraIndex].classList.remove('active');
            
            currentCameraIndex = index;
            options[currentCameraIndex].classList.add('active');
            
            // Scroll selected into view
            options[currentCameraIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            
            updateCameraInfo();
        }

        function updateCameraInfo() {
            const cam = cameras[currentCameraIndex];
            infoName.innerText = `> ${cam.name} <`;
            infoTags.innerText = cam.tags;
            infoDesc.innerText = cam.desc;
            
            // Handle sub-filters UI if we wanted to implement them fully
            const subContainer = document.getElementById('sub-filter-container');
            if (cam.hasSubFilters && subContainer) {
               // In a real app, populate this based on camera config
            }
        }


        // 2. Setup Camera
        async function startCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    facingMode: useFrontCamera ? 'user' : 'environment',
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            };

            try {
                videoStream = await navigator.mediaDevices.getUserMedia(constraints);
                videoElement.srcObject = videoStream;
                
                // Wait for video metadata to set canvas size
                videoElement.onloadedmetadata = () => {
                    videoElement.play();
                    resizeCanvas();
                    if (!animationFrameId) {
                        renderLoop();
                    }
                };
            } catch (err) {
                console.error("Error accessing camera:", err);
                showMessage("Could not access camera. Please check permissions.");
            }
        }

        function resizeCanvas() {
            // Make canvas match window size, but keep aspect ratio of video to avoid stretching
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            
            // For a simpler "full screen cover" effect, we just size canvas to window
            // and use object-fit: cover via CSS, but we need the internal resolution to be decent.
            canvasElement.width = windowWidth;
            canvasElement.height = windowHeight;
        }
        
        window.addEventListener('resize', resizeCanvas);

        // 3. Render Loop (Drawing video to canvas and applying filters)
        function renderLoop(timestamp) {
            animationFrameId = requestAnimationFrame(renderLoop);

            // Throttle FPS to save battery
            if (timestamp - lastFrameTime < frameInterval) return;
            lastFrameTime = timestamp;

            if (videoElement.readyState === videoElement.HAVE_ENOUGH_DATA) {
                const w = canvasElement.width;
                const h = canvasElement.height;
                const cam = cameras[currentCameraIndex];

                // Clear canvas
                ctx.clearRect(0, 0, w, h);

                // Apply base CSS filters for the specific camera
                if (cam.process) {
                    cam.process(ctx, canvasElement, w, h, timestamp);
                } else {
                    ctx.filter = 'none';
                }

                // Handle mirroring for front camera
                ctx.save();
                if (useFrontCamera) {
                    ctx.translate(w, 0);
                    ctx.scale(-1, 1);
                }

                // Draw video frame to cover canvas (simulate object-fit: cover)
                const vRatio = videoElement.videoWidth / videoElement.videoHeight;
                const cRatio = w / h;
                let drawX = 0, drawY = 0, drawW = w, drawH = h;

                if (vRatio > cRatio) {
                    // Video is wider than canvas
                    drawW = h * vRatio;
                    drawX = (w - drawW) / 2;
                } else {
                    // Video is taller than canvas
                    drawH = w / vRatio;
                    drawY = (h - drawH) / 2;
                }

                ctx.drawImage(videoElement, drawX, drawY, drawW, drawH);
                ctx.restore();

                // Reset filter for post-processing overlays
                ctx.filter = 'none';

                // Apply post-processing (grain, vignette, light leaks)
                if (cam.postProcess) {
                    cam.postProcess(ctx, w, h);
                }
            }
        }


        // Helper: Static Noise Generator (Pre-rendered for performance)
        let noiseCanvas, noiseCtx;
        function getNoisePattern(width, height) {
            if (!noiseCanvas || noiseCanvas.width !== width || noiseCanvas.height !== height) {
                noiseCanvas = document.createElement('canvas');
                noiseCanvas.width = width;
                noiseCanvas.height = height;
                noiseCtx = noiseCanvas.getContext('2d');
                
                const imgData = noiseCtx.createImageData(width, height);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    const val = Math.random() * 255;
                    data[i] = val;
                    data[i+1] = val;
                    data[i+2] = val;
                    data[i+3] = 255; // Alpha
                }
                noiseCtx.putImageData(imgData, 0, 0);
            }
            return noiseCanvas;
        }

        function drawNoise(ctx, w, h, opacity, color = 'rgba(0,0,0,0.1)') {
            // Draw pre-calculated noise (animated slightly by jittering position)
            const jitterX = Math.random() * 50;
            const jitterY = Math.random() * 50;
            
            ctx.globalAlpha = opacity;
            ctx.globalCompositeOperation = 'overlay';
            // Assuming noise pattern is large enough, or we tile it. 
            // For simplicity, generate a slightly larger noise map once or tile it.
            // Here we just draw a colored box with noise composite.
            
            // Fallback simplistic noise if getting pattern is too slow:
            // Just tinting with a composite operation creates a gritty feel when combined with video noise
            
            ctx.fillStyle = color;
            ctx.fillRect(0,0,w,h);
            
            // We use globalAlpha to control intensity
            ctx.globalCompositeOperation = 'source-over';
            ctx.globalAlpha = 1.0;
        }

        function applyVignette(ctx, w, h, intensity = 0.5, size = 0.8) {
            const gradient = ctx.createRadialGradient(
                w / 2, h / 2, Math.min(w, h) * 0.2, // Inner circle
                w / 2, h / 2, Math.min(w, h) * size  // Outer circle
            );
            gradient.addColorStop(0, 'rgba(0,0,0,0)');
            gradient.addColorStop(1, `rgba(0,0,0,${intensity})`);
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, w, h);
        }

        function drawLightLeak(ctx, w, h, side, color) {
            const gradient = ctx.createLinearGradient(
                side === 'left' ? 0 : w, 0, 
                side === 'left' ? w * 0.3 : w * 0.7, h * 0.5
            );
            gradient.addColorStop(0, color);
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            
            ctx.globalCompositeOperation = 'screen';
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, w, h);
            ctx.globalCompositeOperation = 'source-over';
        }

        function drawScratches(ctx, w, h, count, opacity) {
            ctx.strokeStyle = `rgba(255,255,255,${opacity})`;
            ctx.beginPath();
            for(let i=0; i<count; i++) {
                const x = Math.random() * w;
                ctx.moveTo(x, 0);
                // Slight angle
                ctx.lineTo(x + (Math.random() * 20 - 10), h);
            }
            ctx.stroke();
            
            ctx.strokeStyle = `rgba(0,0,0,${opacity * 0.5})`;
            ctx.beginPath();
            for(let i=0; i<count; i++) {
                const x = Math.random() * w;
                ctx.moveTo(x, 0);
                ctx.lineTo(x + (Math.random() * 20 - 10), h);
            }
            ctx.stroke();
        }


        // 4. Interaction Logic
        switchCamBtn.addEventListener('click', () => {
            useFrontCamera = !useFrontCamera;
            startCamera();
        });

        captureBtn.addEventListener('click', () => {
            // Flash Effect
            flashScreen.style.opacity = '1';
            setTimeout(() => {
                flashScreen.style.opacity = '0';
            }, 100);

            // Play sound (simulated by a small delay before updating preview)
            setTimeout(saveSnapshot, 150);
        });

        function saveSnapshot() {
            // Get data URL from the canvas containing the filtered image
            const dataURL = canvasElement.toDataURL('image/jpeg', 0.9);
            
            // Update Mini Preview
            previewImg.src = dataURL;
            previewContainer.style.display = 'block';
            
            // Optional: Animation for preview appearing
            previewContainer.style.transform = 'scale(1.2)';
            setTimeout(() => previewContainer.style.transform = 'scale(1)', 200);
        }

        // Fullscreen viewing
        previewContainer.addEventListener('click', () => {
            fullscreenImg.src = previewImg.src;
            fullscreenView.style.display = 'flex';
        });

        closeFullscreenBtn.addEventListener('click', () => {
            fullscreenView.style.display = 'none';
        });

        savePhotoBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `retro_cam_${Date.now()}.jpg`;
            link.href = fullscreenImg.src;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        // Utilities
        function showMessage(text) {
            messageText.innerText = text;
            messageBox.style.display = 'block';
        }

        closeMessageBtn.addEventListener('click', () => {
            messageBox.style.display = 'none';
        });

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            initUI();
            
            // Request permissions and start
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                startCamera();
            } else {
                showMessage("Your browser does not support camera access.");
            }
        });

    </script>
</body>
</html>
