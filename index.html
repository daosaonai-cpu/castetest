<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT 100 MCQ Quiz & Registration</title>

        body {

            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 650px;
            padding: 30px;
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 15px;
        }
        
        /* Form Styles */
        #form-section {
            display: block;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #34495e;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd3da;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        
        /* Quiz Styles */
        #quiz-area {
            display: none;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #ecf0f1;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #3498db;
            width: 0%;
            transition: width 0.3s;
        }
        .question-number {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .question-text {
            font-size: 18px;
            margin-bottom: 20px;
            line-height: 1.5;
            font-weight: 500;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option {
            padding: 14px 18px;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            font-size: 16px;
        }
        .option:hover:not(.disabled) {
            background: #e2e6ea;
            border-color: #cbd3da;
        }
        .option.correct {
            background: #d4edda;
            border-color: #28a745;
            color: #155724;
        }
        .option.wrong {
            background: #f8d7da;
            border-color: #dc3545;
            color: #721c24;
        }
        .option.disabled {
            cursor: not-allowed;
        }
        
        /* Buttons */
        .btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin-top: 25px;
            background: #3498db;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover:not(:disabled) {
            background: #2980b9;
        }
        .btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }

        /* Score Area */
        #score-area {
            display: none;
            text-align: center;
        }
        .score-text {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        .score-feedback {
            font-size: 18px;
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        #loading-msg {
            display: none;
            color: #f39c12;
            font-weight: bold;
            margin-bottom: 15px;
        }
    </style>
</head>

        <div class="form-group"><label>Phone Number</label><input type="tel" id="phone" required></div>
        <div class="form-group"><label>Address</label><textarea id="address" rows="3" required></textarea></div>
        
        <button class="btn" onclick="startQuiz()">Start Quiz</button>
    </div>

    <!-- QUIZ SECTION -->
    <div id="quiz-area">
        <h1>IoT Master Quiz</h1>
        <div class="progress-bar">
            <div class="progress-fill" id="progress"></div>
        </div>
        <div class="question-number" id="question-number">Question 1 of 100</div>
        <div class="question-text" id="question-text">Loading question...</div>
        <div class="options" id="options-container">
            <!-- Options injected by JS -->
        </div>
        <button class="btn" id="next-btn" disabled>Next Question</button>
    </div>

    <!-- SCORE & SUBMISSION SECTION -->
    <div id="score-area">
        <h2 id="score-title">Quiz Completed!</h2>
        <div id="loading-msg">Submitting your results to the server... Please wait.</div>
        <div class="score-text" id="score-text">You scored 0 out of 100!</div>
        <div class="score-feedback" id="score-feedback"></div>
    </div>

</div>

    function startQuiz() {
        // Collect Data
        userData = {
            name: document.getElementById('name').value.trim(),
            roll: document.getElementById('roll').value.trim(),
            institute: document.getElementById('institute').value.trim(),
            department: document.getElementById('department').value.trim(),

            state: document.getElementById('state').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            address: document.getElementById('address').value.trim()
        };

        // Basic Validation
        if (!userData.name || !userData.roll || !userData.institute || !userData.phone) {
            alert("Please fill out all the fields to start the quiz.");
            return;
        }

        // Hide Form, Show Quiz
        formSection.style.display = 'none';
        quizArea.style.display = 'block';
        
        loadQuestion();
    }

    // ---------------------------------------------------------
    // 3. QUIZ LOGIC
    // ---------------------------------------------------------
    function loadQuestion() {
        hasAnswered = false;
        nextBtn.disabled = true;
        
        const currentQ = quizData[currentQuestionIndex];
        
        // Update UI Text
        questionNumberEl.innerText = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
        questionTextEl.innerText = currentQ.q;
        
        // Update Progress Bar
        const progressPercentage = (currentQuestionIndex / quizData.length) * 100;
        progressFill.style.width = `${progressPercentage}%`;

        // Clear and Generate Options
        optionsContainer.innerHTML = '';
        currentQ.o.forEach((optionText, index) => {
            const optionDiv = document.createElement('div');
            optionDiv.classList.add('option');
            optionDiv.innerText = optionText;
            optionDiv.onclick = () => selectOption(index, optionDiv);
            optionsContainer.appendChild(optionDiv);
        });
    }

    function selectOption(selectedIndex, optionElement) {
        if (hasAnswered) return;
        hasAnswered = true;

        const correctIndex = quizData[currentQuestionIndex].a;
        const allOptions = optionsContainer.children;

        // Check Answer
        if (selectedIndex === correctIndex) {
            optionElement.classList.add('correct');
            score++;
        } else {
            optionElement.classList.add('wrong');
            allOptions[correctIndex].classList.add('correct'); // Show correct
        }

        // Lock options
        for (let opt of allOptions) opt.classList.add('disabled');

        // Enable Next Button
        nextBtn.disabled = false;
        if (currentQuestionIndex === quizData.length - 1) {
            nextBtn.innerText = "Submit Quiz";
        }
    }

    nextBtn.onclick = () => {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            finishQuiz();
        }
    };

    // ---------------------------------------------------------
    // 4. SUBMISSION TO TELEGRAM

    function finishQuiz() {
        quizArea.style.display = 'none';
        scoreArea.style.display = 'block';
        loadingMsg.style.display = 'block'; // Show loading

        // Set Final Feedback text based on score
        scoreText.innerText = `You scored ${score} out of ${quizData.length}!`;
        const percentage = (score / quizData.length) * 100;
        if (percentage >= 90) scoreFeedback.innerText = "Excellent! You are an IoT Master.";
        else if (percentage >= 70) scoreFeedback.innerText = "Great job! Solid understanding of IoT.";
        else if (percentage >= 50) scoreFeedback.innerText = "Good effort! Review the basics and try again.";
        else scoreFeedback.innerText = "Keep learning! IoT is a vast field.";

        // Send Data
        sendToTelegram(score);
    }

        // Using HTML Parse mode for Telegram to safely handle user inputs
        const message = `
<b>📝 New IoT Quiz Submission</b>
-----------------------------------
<b>Name:</b> ${userData.name}
<b>Roll No:</b> ${userData.roll}
<b>Institute:</b> ${userData.institute}
<b>Department:</b> ${userData.department}
<b>Semester:</b> ${userData.semester}
<b>State:</b> ${userData.state}
<b>Phone:</b> ${userData.phone}
<b>Address:</b> ${userData.address}
-----------------------------------
<b>🎯 Final Score:</b> ${finalScore} / 100
        `;

        const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: chatId,
                text: message,
                parse_mode: 'HTML'
            })
        })
        .then(response => response.json())
        .then(data => {
            loadingMsg.style.display = 'none'; // Hide loading
            if (data.ok) {
                // Successfully sent
                scoreFeedback.innerHTML += "<br><br><span style='color:green;'><b>✓ Your results have been successfully sent to the coordinator!</b></span>";
            } else {
                alert("Error sending data to Telegram: " + data.description);
            }
        })
        .catch(error => {
            console.error("Error:", error);
            loadingMsg.style.display = 'none';
            alert("A network error occurred while submitting results. Please check your internet connection.");
        });
    }
</script>

</body>
</html>
