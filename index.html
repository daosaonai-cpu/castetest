<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        :root {
            --primary: #1d4ed8; 
            --primary-hover: #1e40af;
            --secondary: #f1f5f9;
            --background: #e2e8f0;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border-color: #cbd5e1;
            --input-bg: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background);
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center; /* Centered for a smaller form */
            min-height: 100vh;
        }

        .main-wrapper {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            max-width: 500px; /* Reduced width for a simpler form */
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: var(--primary);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }

        .container {
            padding: 30px;
        }

        .form-group { margin-bottom: 20px; }
        
        label { 
            display: block; 
            font-weight: 600; 
            margin-bottom: 8px; 
            color: #334155; 
            font-size: 14px;
        }
        
        input[type="text"], input[type="tel"], textarea {
            width: 100%; 
            padding: 12px 15px; 
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 15px;
            color: var(--text-dark);
            transition: all 0.2s ease;
            font-family: inherit;
        }
        
        input[type="text"]:focus, input[type="tel"]:focus, textarea:focus { 
            border-color: var(--primary); 
            background-color: white;
            outline: none; 
            box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn-submit {
            width: 100%; 
            background: var(--primary);
            color: white;
            border: none; 
            padding: 14px; 
            font-size: 16px; 
            font-weight: bold;
            border-radius: 8px; 
            cursor: pointer; 
            transition: background 0.2s, transform 0.1s;
            margin-top: 10px;
        }
        
        .btn-submit:hover { 
            background: var(--primary-hover);
        }
        
        .btn-submit:active { 
            transform: scale(0.99);
        }

        .success-message {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }

        .success-message h2 {
            color: #10b981;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .success-message p {
            color: var(--text-muted);
            font-size: 15px;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .container { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="main-wrapper">
    <div class="header">
        <h1>Registration Form</h1>
    </div>

    <div class="container" id="formContainer">
        <form id="misForm">
            
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" required placeholder="Enter Full Name">
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phone" required placeholder="Enter Mobile Number">
            </div>

            <div class="form-group">
                <label>Complete Address</label>
                <textarea name="address" required placeholder="Enter your full address here..."></textarea>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Submit Details</button>
        </form>
    </div>

    <!-- Success View -->
    <div class="success-message" id="successView">
        <h2>✅ Registration Successful!</h2>
        <p>Your information has been sent to the chat.</p>
        <button class="btn-submit" onclick="location.reload()" style="width: auto; padding: 10px 30px; margin-top: 20px;">Submit Another</button>
    </div>
</div>

<script>
    // Telegram Bot Configuration
    const BOT_TOKEN = '8919666195:AAE1kQrD3SEXBYbKZPrOjtoFUHljDxZHPYY';
    const CHAT_ID = '2147403583';

    // Handle Form Submission and send to Telegram
    document.getElementById('misForm').addEventListener('submit', async function(e) {
        e.preventDefault(); 
        
        const submitBtn = document.getElementById('submitBtn');
        const originalBtnText = submitBtn.innerText;
        submitBtn.innerText = 'Sending... Please wait';
        submitBtn.disabled = true;

        const formData = new FormData(this);
        
        // Construct the simple message
        let message = `📝 *New Registration Details*\n\n`;
        message += `*Name:* ${formData.get('name')}\n`;
        message += `*Phone:* ${formData.get('phone')}\n`;
        message += `*Address:* ${formData.get('address')}`;

        try {
            // Send the text message
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message,
                    parse_mode: 'Markdown'
                })
            });

            // Update UI to Success View
            document.getElementById('formContainer').style.display = 'none';
            document.getElementById('successView').style.display = 'block';
            
        } catch (error) {
            console.error('Telegram API Error:', error);
            alert('There was an error submitting your details. Please try again.');
        } finally {
            // Re-enable button (in case of error or if they use dev tools to go back)
            submitBtn.innerText = originalBtnText;
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
