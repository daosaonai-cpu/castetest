            <div class="slide active title-slide" id="slide-1"><i class="fa-solid fa-lock main-logo"></i><h1>Encryption & Decryption</h1><p>Digital Secrets, Confidentiality, and Authenticity</p></div>
            <div class="slide" id="slide-2"><div class="slide-layout"><div class="slide-content"><h2><i class="fa-solid fa-file-shield"></i> The Core of Confidentiality</h2><ul><li><strong>Plaintext:</strong> The original, readable message, such as "Meet me at the park at 5 PM."</li><li><strong>Readability:</strong> Plaintext can be understood instantly by anyone without special tools.</li><li><strong>Ciphertext:</strong> The scrambled, encrypted version of the message, looking like "Xy6lp Qw9z".</li><li><strong>Reversing it:</strong> Ciphertext requires a specific mathematical secret key to turn back into Plaintext.</li></ul></div><div class="slide-image"><img src="https://images.unsplash.com/photo-1614064641938-3bbee52942c7?auto=format&fit=crop&w=800&q=80" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=800&q=80';" alt="Padlock on glowing digital code"></div></div></div>
            <div class="slide" id="slide-3"><div class="slide-layout"><div class="slide-content"><h2><i class="fa-solid fa-gear"></i> Ancient Origins</h2><ul><li><strong>Mechanical Complexity:</strong> Before the digital age, encryption was largely a mechanical process.</li><li><strong>The Enigma Machine:</strong> Used during WWII, this machine utilized complex rotors to scramble letters into trillions of daily combinations.</li><li><strong>Historical Impact:</strong> Cracking this code at Bletchley Park changed the course of history and laid the groundwork for modern computer science.</li></ul></div><div class="slide-image"><img src="https://image.pollinations.ai/prompt/World%20War%202%20Enigma%20machine%20on%20a%20desk,%20cinematic,%20photorealistic?width=800&height=600&nologo=true" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1509343259692-8091a4574971?auto=format&fit=crop&w=800&q=80';" alt="AI Generated Historical Enigma Machine"></div></div></div>
            <div class="slide" id="slide-4"><div class="slide-layout"><div class="slide-content"><h2><i class="fa-solid fa-key"></i> Symmetric Encryption</h2><ul><li><strong>One Shared Key:</strong> Both the sender and the receiver use the exact same secret key to lock and unlock information.</li><li><strong>Speed & Efficiency:</strong> Because the math is simpler, this method is incredibly fast and ideal for encrypting large amounts of data.</li><li><strong>Real-Life Example:</strong> A home Wi-Fi password acts as a single key that both the router and phone use to encrypt traffic.</li></ul></div><div class="slide-image"><img src="https://images.unsplash.com/photo-1544197150-b99a580bb7a8?auto=format&fit=crop&w=800&q=80" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=800&q=80';" alt="Glowing network cables representing fast symmetric encryption"></div></div></div>
            <div class="slide" id="slide-5"><div class="slide-layout"><div class="slide-content"><h2><i class="fa-solid fa-key-skeleton"></i> Asymmetric Encryption</h2><ul><li><strong>The Magic Pair:</strong> This method uses a mathematically linked Public Key and Private Key.</li><li><strong>Public Key:</strong> Operates like a mailbox address that anyone can use to send you a locked letter.</li><li><strong>Private Key:</strong> The physical key only you hold to open that specific mailbox.</li><li><strong>The Solution:</strong> Elegantly solves the issue of sharing secret keys over the internet without them being stolen.</li></ul></div><div class="slide-image"><img src="https://images.unsplash.com/photo-1529148482759-b35b25c5f217?auto=format&fit=crop&w=800&q=80" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=800&q=80';" alt="Row of secure mailboxes representing public keys"></div></div></div>
            <div class="slide" id="slide-6"><div class="slide-layout"><div class="slide-content"><h2><i class="fa-solid fa-shield-halved"></i> HTTPS & Brute Force</h2><ul><li><strong>HTTPS Handshake:</strong> A browser requests a server's Public Key, creates a one-time Symmetric key, and encrypts it to secure the session.</li><li><strong>Brute Force Defense:</strong> Modern AES-256 encryption offers 2<sup>256</sup> possible key combinations.</li><li><strong>Unimaginable Math:</strong> There are more key combinations than atoms in the observable universe.</li><li><strong>Security Bedrock:</strong> Harnessing all computing power on Earth would take trillions of years to guess the key.</li></ul></div><div class="slide-image"><img src="https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&w=800&q=80" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=800&q=80';" alt="The universe representing an unimaginable number of atoms and combinations"></div></div></div>
            <div class="slide" id="slide-7"><div class="slide-layout"><div class="slide-content"><h2><i class="fa-solid fa-robot"></i> The Authenticity Crisis</h2><ul><li><strong>Rise of AI:</strong> Generative AI is dissolving the line between reality and synthetic media by creating hyper-realistic content.</li><li><strong>New Risks:</strong> This technological shift creates massive new risks regarding fraud and misinformation.</li><li><strong>The Encryption Gap:</strong> Encryption hides content well, but cannot prove its original source or whether it is artificial.</li></ul></div><div class="slide-image"><img src="https://images.unsplash.com/photo-1677442136019-21780ecad995?auto=format&fit=crop&w=800&q=80" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=800&q=80';" alt="A hyper-realistic artificial intelligence face"></div></div></div>
            <div class="slide" id="slide-8"><div class="slide-layout"><div class="slide-content"><h2><i class="fa-solid fa-fingerprint"></i> What is SynthID?</h2><ul><li><strong>Digital Watermarking:</strong> Developed by Google DeepMind, SynthID embeds an imperceptible signal directly into AI-generated content.</li><li><strong>Resilient Design:</strong> Unlike visible watermarks, it is woven into pixels or sound waves at the exact moment of generation.</li><li><strong>Multi-Medium:</strong> Protects images/videos (pixel adjustments), audio (spectrogram frequencies), and text (tournament sampling of an LLM's word choices).</li></ul></div><div class="slide-image"><img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=800&q=80" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=800&q=80';" alt="Digital fingerprint representing synthetic media watermarks"></div></div></div>
            <div class="slide end-slide" id="slide-9"><i class="fa-solid fa-network-wired main-logo" style="font-size: 4em; margin-bottom: 0;"></i><h1 style="font-size: 3.5em; margin-top: 15px; margin-bottom: 10px;">The Future of Security</h1><p style="font-size: 1.5em; color: var(--text-muted);">Trust is not simply a matter of security; it is the fundamental currency of a functioning digital society.</p><div style="margin-top: 40px; padding: 15px 40px; background: rgba(0, 240, 255, 0.1); border: 1px solid var(--accent-primary); border-radius: 30px; color: var(--accent-primary); font-weight: bold; font-family: 'Poppins', sans-serif; letter-spacing: 2px;">THANK YOU</div></div>
            <div class="controls"><div class="counter"><span id="currentNum">1</span> / <span id="totalNum">9</span></div></div>
        </div>
        <script>
            let currentSlideIndex = 0; const slides = document.querySelectorAll('.slide'); const currentNum = document.getElementById('currentNum'); const progressBar = document.getElementById('progressBar'); document.getElementById('totalNum').innerText = slides.length;
            function updateSlides() { slides.forEach((slide, index) => { slide.classList.remove('active'); if (index === currentSlideIndex) { slide.classList.add('active'); } }); currentNum.innerText = currentSlideIndex + 1; progressBar.style.width = ((currentSlideIndex / (slides.length - 1)) * 100) + '%'; }
            function changeSlide(direction) { currentSlideIndex += direction; if (currentSlideIndex < 0) currentSlideIndex = 0; else if (currentSlideIndex >= slides.length) currentSlideIndex = slides.length - 1; updateSlides(); }
            updateSlides(); document.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') { if (currentSlideIndex < slides.length - 1) changeSlide(1); } else if (e.key === 'ArrowLeft') { if (currentSlideIndex > 0) changeSlide(-1); } });
            let touchstartX = 0; let touchendX = 0; const minSwipeDistance = 50;
            function handleGesture() { if (touchendX < touchstartX - minSwipeDistance) { if (currentSlideIndex < slides.length - 1) changeSlide(1); } if (touchendX > touchstartX + minSwipeDistance) { if (currentSlideIndex > 0) changeSlide(-1); } }
            document.addEventListener('touchstart', e => { touchstartX = e.changedTouches[0].screenX; }); document.addEventListener('touchend', e => { touchendX = e.changedTouches[0].screenX; handleGesture(); });
        </script>

            <main class="flex-1 overflow-y-auto bg-slate-950 p-4 md:p-8 relative">
                <div id="sec-intro" class="section active max-w-5xl mx-auto"><h2 class="text-3xl md:text-4xl font-bold text-white mb-6">The Foundations of Cryptography</h2><div class="grid grid-cols-1 lg:grid-cols-3 gap-8"><div class="lg:col-span-2 space-y-6 text-slate-400 leading-relaxed"><p class="text-lg text-slate-300">Welcome to the Cybersecurity Workbench. Over the next hour, you will transform from a novice to someone who deeply understands how digital secrets are kept.</p><div class="glass-panel p-6 rounded-xl"><h3 class="text-xl font-semibold text-emerald-400 mb-3">What is Cryptography?</h3><p>Cryptography is the practice of securing communication in the presence of adversaries. The core components are:</p><ul class="list-disc pl-5 mt-3 space-y-2"><li><strong class="text-white">Plaintext:</strong> The original, readable message.</li><li><strong class="text-white">Ciphertext:</strong> The scrambled, unreadable output.</li><li><strong class="text-white">Encryption:</strong> The algorithm that turns Plaintext into Ciphertext.</li><li><strong class="text-white">Decryption:</strong> The reverse algorithm.</li><li><strong class="text-white">Key:</strong> A secret piece of information that dictates exactly how the algorithm scrambles the data. Without the key, the algorithm is useless.</li></ul></div><h3 class="text-2xl font-semibold text-white mt-8 mb-4">The Actors: Alice, Bob, and Eve</h3><p>In cryptography, we traditionally use characters to explain scenarios:</p><div class="flex flex-col md:flex-row gap-4 mt-4"><div class="flex-1 bg-slate-900 p-4 rounded border border-slate-700 text-center"><i class="ph ph-user text-3xl text-cyan-400 mb-2"></i><h4 class="font-bold text-white">Alice</h4><p class="text-sm">Wants to send a secret message to Bob.</p></div><div class="flex-1 bg-slate-900 p-4 rounded border border-slate-700 text-center"><i class="ph ph-user text-3xl text-emerald-400 mb-2"></i><h4 class="font-bold text-white">Bob</h4><p class="text-sm">Wants to read Alice's message securely.</p></div><div class="flex-1 bg-red-900/20 p-4 rounded border border-red-900/50 text-center"><i class="ph ph-detective text-3xl text-red-400 mb-2"></i><h4 class="font-bold text-white">Eve</h4><p class="text-sm">The eavesdropper intercepting the network.</p></div></div><p class="mt-4">If Alice sends plaintext, Eve reads it. If Alice encrypts it, Eve only sees random noise. The challenge of cryptography is making sure Bob has the key to decrypt it, without Eve ever getting that key.</p></div><div class="space-y-6"><div class="bg-gradient-to-br from-slate-800 to-slate-900 p-6 rounded-xl border border-slate-700"><h3 class="font-bold text-white mb-2">Your Mission</h3><p class="text-sm text-slate-400 mb-4">Go through the sidebar modules one by one. Read the theory, play with the interactive tools, and understand the vulnerabilities.</p><p class="text-sm text-slate-400 mb-4">Once you reach the <strong>Capture The Flag</strong> section, you will use the tools you've learned to decode hidden messages.</p><button onclick="switchTab('caesar')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 px-4 rounded transition">Start with Caesar Cipher &rarr;</button></div></div></div></div>
                <div id="sec-caesar" class="section max-w-6xl mx-auto"><h2 class="text-3xl md:text-4xl font-bold text-white mb-2">Caesar Cipher</h2><p class="text-slate-400 mb-8">The dawn of cryptography: Substitution Ciphers.</p><div class="grid grid-cols-1 lg:grid-cols-2 gap-8"><div class="space-y-6"><div class="glass-panel p-6 rounded-xl"><h3 class="text-xl font-semibold text-emerald-400 mb-3">How it works</h3><p class="text-slate-300 text-sm leading-relaxed mb-4">Used by Julius Caesar in 58 BC, this is a <strong>substitution cipher</strong>. Every letter in the plaintext is shifted a certain number of places down the alphabet. For example, with a shift of 1, A becomes B, B becomes C, and Z wraps around to A.</p><p class="text-slate-300 text-sm leading-relaxed font-bold text-red-400">The Vulnerability: Frequency Analysis & Brute Force</p><p class="text-slate-300 text-sm leading-relaxed">Since there are only 25 possible shifts, a modern computer (or a bored human) can simply try all 25 until the text makes sense. Furthermore, because it's a direct substitution, the most common letter in the ciphertext will usually correspond to 'E', the most common letter in English.</p></div><div class="glass-panel p-6 rounded-xl border-red-900/50 bg-red-900/10"><h3 class="text-xl font-semibold text-red-400 mb-3 flex items-center gap-2"><i class="ph ph-skull"></i> Brute Force Attacker</h3><p class="text-sm text-slate-400 mb-4">Paste intercepted ciphertext here to instantly try all 25 possible keys. Green text indicates english dictionary matches.</p><textarea id="caesar-brute-input" class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-white font-mono text-sm focus:border-red-500 focus:outline-none mb-4" rows="2" placeholder="Paste intercepted text..."></textarea><button onclick="runCaesarBruteForce()" class="bg-red-600 hover:bg-red-500 text-white font-semibold py-2 px-4 rounded transition text-sm">Initiate Brute Force</button><div id="caesar-brute-results" class="mt-4 max-h-60 overflow-y-auto font-mono text-xs space-y-1 bg-slate-950 p-2 rounded hidden"></div></div></div><div class="glass-panel p-6 rounded-xl"><h3 class="text-xl font-semibold text-white mb-4">Interactive Lab</h3><label class="block text-sm font-medium text-slate-400 mb-2">Shift (Key): <span id="caesar-shift-val" class="text-cyan-400 font-bold">3</span></label><input type="range" id="caesar-shift" min="1" max="25" value="3" class="w-full accent-cyan-500 mb-6" oninput="updateCaesar()"><label class="block text-sm font-medium text-slate-400 mb-2">Plaintext</label><textarea id="caesar-plain" class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-white font-mono text-sm focus:border-cyan-500 focus:outline-none mb-6 transition-colors" rows="4" oninput="updateCaesar('plain')">ATTACK AT DAWN</textarea><div class="flex justify-center mb-6"><i class="ph ph-arrows-down-up text-3xl text-slate-600"></i></div><label class="block text-sm font-medium text-slate-400 mb-2">Ciphertext</label><textarea id="caesar-cipher" class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-emerald-400 font-mono text-sm focus:border-emerald-500 focus:outline-none transition-colors" rows="4" oninput="updateCaesar('cipher')"></textarea></div></div></div>
                <div id="sec-vigenere" class="section max-w-6xl mx-auto"><h2 class="text-3xl md:text-4xl font-bold text-white mb-2">Vigenère Cipher</h2><p class="text-slate-400 mb-8">The unbreakable cipher of the 16th century: Polyalphabetic Substitution.</p><div class="grid grid-cols-1 lg:grid-cols-2 gap-8"><div class="space-y-6"><div class="glass-panel p-6 rounded-xl"><h3 class="text-xl font-semibold text-emerald-400 mb-3">How it works</h3><p class="text-slate-300 text-sm leading-relaxed mb-4">To defeat frequency analysis, Giovan Battista Bellaso invented a cipher that uses a <strong>keyword</strong>. Instead of shifting the whole message by one number (like Caesar), every letter is shifted by a different amount based on the repeating keyword.</p><p class="text-slate-300 text-sm leading-relaxed mb-4">If the keyword is "LEMON", the first letter of plaintext is shifted by 'L' (11), the second by 'E' (4), and so on. The key repeats: LEMONLEMONLEM.</p><p class="text-slate-300 text-sm leading-relaxed font-bold text-red-400">The Vulnerability: Kasiski Examination</p><p class="text-slate-300 text-sm leading-relaxed">It was considered unbreakable ("le chiffre indéchiffrable") for 300 years! In 1863, Friedrich Kasiski published a method. If you find repeating sequences in the ciphertext, the distance between them is likely a multiple of the keyword length. Once you know the key length, you break it down into several standard Caesar ciphers and solve them individually.</p></div></div><div class="glass-panel p-6 rounded-xl"><h3 class="text-xl font-semibold text-white mb-4">Interactive Lab</h3><label class="block text-sm font-medium text-slate-400 mb-2">Keyword</label><input type="text" id="vigenere-key" class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-cyan-400 font-mono text-sm focus:border-cyan-500 focus:outline-none mb-6 uppercase" value="LEMON" oninput="updateVigenere('plain')"><label class="block text-sm font-medium text-slate-400 mb-2">Plaintext</label><textarea id="vigenere-plain" class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-white font-mono text-sm focus:border-cyan-500 focus:outline-none mb-6" rows="4" oninput="updateVigenere('plain')">ATTACK AT DAWN</textarea><div class="flex justify-center mb-6"><i class="ph ph-arrows-down-up text-3xl text-slate-600"></i></div><label class="block text-sm font-medium text-slate-400 mb-2">Ciphertext</label><textarea id="vigenere-cipher" class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-emerald-400 font-mono text-sm focus:border-emerald-500 focus:outline-none" rows="4" oninput="updateVigenere('cipher')"></textarea></div></div></div>
                <div id="sec-aes" class="section max-w-6xl mx-auto"><h2 class="text-3xl md:text-4xl font-bold text-white mb-2">Symmetric Encryption: AES-GCM</h2><p class="text-slate-400 mb-8">The modern standard for keeping secrets. One key locks and unlocks.</p><div class="grid grid-cols-1 lg:grid-cols-2 gap-8"><div class="space-y-6"><div class="glass-panel p-6 rounded-xl"><h3 class="text-xl font-semibold text-emerald-400 mb-3">Advanced Encryption Standard</h3><p class="text-slate-300 text-sm leading-relaxed mb-4">AES is a block cipher established by NIST in 2001. Unlike Caesar or Vigenère, which operate on individual letters, AES operates on blocks of <strong>bits</strong> using complex mathematical substitutions and permutations.</p><h4 class="font-bold text-white mt-4 mb-2">The Components:</h4><ul class="list-disc pl-5 text-sm text-slate-300 space-y-2"><li><strong>Password/Key:</strong> Used to encrypt. In modern web apps, a human password is fed through a Key Derivation Function (like PBKDF2) to generate a secure 256-bit mathematical key.</li><li><strong>Salt:</strong> Random data added to the password before derivation to prevent dictionary attacks.</li><li><strong>IV (Initialization Vector):</strong> A random number added to the encryption process. If you encrypt the same message twice with the same password, the IV ensures the ciphertexts look completely different.</li><li><strong>GCM (Galois/Counter Mode):</strong> The specific "mode" of AES. GCM not only encrypts the data (Confidentiality) but adds a tag to ensure the data hasn't been tampered with (Integrity).</li></ul></div></div><div class="glass-panel p-6 rounded-xl"><h3 class="text-xl font-semibold text-white mb-4">Interactive Lab (Real WebCrypto API)</h3><label class="block text-sm font-medium text-slate-400 mb-2">Secret Password</label><div class="relative mb-6"><input type="password" id="aes-pass" class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-cyan-400 font-mono text-sm focus:border-cyan-500 focus:outline-none" value="SuperSecret123"><button onclick="toggleVisibility('aes-pass')" class="absolute right-3 top-3 text-slate-400 hover:text-white"><i class="ph ph-eye"></i></button></div><label class="block text-sm font-medium text-slate-400 mb-2">Plaintext</label><textarea id="aes-plain" class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-white font-mono text-sm focus:border-cyan-500 focus:outline-none mb-4" rows="3">This is highly classified information.</textarea><div class="flex gap-4 mb-6"><button onclick="executeAESEncrypt()" class="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-2 px-4 rounded transition flex justify-center items-center gap-2"><i class="ph ph-lock-key"></i> Encrypt</button><button onclick="executeAESDecrypt()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 px-4 rounded transition flex justify-center items-center gap-2"><i class="ph ph-lock-key-open"></i> Decrypt</button></div><label class="block text-sm font-medium text-slate-400 mb-2">Ciphertext (Base64 Encoded)</label><textarea id="aes-cipher" class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-emerald-400 font-mono text-xs focus:border-emerald-500 focus:outline-none mb-2 break-all" rows="4"></textarea><p class="text-xs text-slate-500">Note: This Base64 string actually contains [Salt + IV + Ciphertext] concatenated together.</p></div></div></div>
                <div id="sec-rsa" class="section max-w-6xl mx-auto"><h2 class="text-3xl md:text-4xl font-bold text-white mb-2">Asymmetric Encryption: RSA</h2><p class="text-slate-400 mb-8">Public Key Cryptography. Two keys: one to lock, one to unlock.</p><div class="grid grid-cols-1 lg:grid-cols-2 gap-8"><div class="space-y-6"><div class="glass-panel p-6 rounded-xl"><h3 class="text-xl font-semibold text-emerald-400 mb-3">The Key Exchange Problem</h3><p class="text-slate-300 text-sm leading-relaxed mb-4">Symmetric encryption (AES) is incredibly fast and secure, but there's a fatal flaw: <strong>How does Alice securely get the password to Bob over the internet without Eve stealing it?</strong></p><h4 class="font-bold text-white mt-4 mb-2">The Solution: Asymmetric Encryption</h4><p class="text-slate-300 text-sm leading-relaxed mb-4">In 1977, Rivest, Shamir, and Adleman (RSA) published a system using prime numbers. Instead of one key, you generate a mathematically linked <strong>Key Pair</strong>:</p><ul class="list-disc pl-5 text-sm text-slate-300 space-y-2 mb-4"><li><strong class="text-cyan-400">Public Key:</strong> You give this to everyone in the world. It can ONLY encrypt data. It is physically impossible for it to decrypt data.</li><li><strong class="text-red-400">Private Key:</strong> You keep this secret. It is the ONLY thing that can decrypt data encrypted by your Public Key.</li></ul><p class="text-slate-300 text-sm leading-relaxed italic">Analogy: Bob hands out hundreds of open padlocks (Public Keys). Alice puts her message in a box, snaps Bob's padlock shut, and mails it. Now, NO ONE can open the box—not even Alice! Only Bob, who has the only key (Private Key) to that padlock, can open it.</p></div><div class="glass-panel p-6 rounded-xl border-cyan-900/50"><div class="flex justify-between items-center mb-4"><h3 class="text-xl font-semibold text-cyan-400">Your Keys</h3><button onclick="generateRSAKeys()" class="bg-slate-700 hover:bg-slate-600 text-white font-semibold py-1.5 px-3 rounded text-sm transition flex items-center gap-2" id="rsa-gen-btn"><i class="ph ph-arrows-clockwise"></i> Generate New Pair</button></div><div class="grid grid-cols-1 gap-4"><div><label class="block text-xs font-semibold text-cyan-400 mb-1 uppercase tracking-wider">Public Key (Share widely)</label><textarea id="rsa-pub-display" readonly class="w-full bg-slate-900 border border-slate-700 rounded p-2 key-block font-mono text-[10px] focus:outline-none" rows="4">Click 'Generate New Pair' to create 2048-bit RSA keys.</textarea></div><div><label class="block text-xs font-semibold text-red-400 mb-1 uppercase tracking-wider">Private Key (NEVER SHARE)</label><textarea id="rsa-priv-display" readonly class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-red-300 font-mono text-[10px] focus:outline-none" rows="4">Click 'Generate New Pair' to create 2048-bit RSA keys.</textarea></div></div></div></div><div class="glass-panel p-6 rounded-xl flex flex-col"><h3 class="text-xl font-semibold text-white mb-4">Interactive Lab</h3><label class="block text-sm font-medium text-slate-400 mb-2">Short Plaintext Message</label><textarea id="rsa-plain" class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-white font-mono text-sm focus:border-cyan-500 focus:outline-none mb-2" rows="3" placeholder="Type a message here..."></textarea><p class="text-xs text-slate-500 mb-6 text-right">RSA is slow and can only encrypt small amounts of data (usually max ~190 bytes for a 2048-bit key).</p><div class="flex gap-4 mb-6"><button onclick="executeRSAEncrypt()" class="flex-1 bg-cyan-600 hover:bg-cyan-500 text-white font-semibold py-2 px-4 rounded transition flex flex-col justify-center items-center gap-1"><span class="flex items-center gap-2"><i class="ph ph-lock-key"></i> Encrypt</span><span class="text-[10px] opacity-75">(Uses Public Key)</span></button><button onclick="executeRSADecrypt()" class="flex-1 bg-red-600 hover:bg-red-500 text-white font-semibold py-2 px-4 rounded transition flex flex-col justify-center items-center gap-1"><span class="flex items-center gap-2"><i class="ph ph-lock-key-open"></i> Decrypt</span><span class="text-[10px] opacity-75">(Uses Private Key)</span></button></div><label class="block text-sm font-medium text-slate-400 mb-2">Ciphertext (Base64)</label><textarea id="rsa-cipher" class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-emerald-400 font-mono text-xs focus:border-emerald-500 focus:outline-none flex-1 min-h-[150px] break-all" placeholder="Encrypted data will appear here..."></textarea></div></div></div>
                <div id="sec-hashing" class="section max-w-6xl mx-auto"><h2 class="text-3xl md:text-4xl font-bold text-white mb-2">Cryptographic Hashing</h2><p class="text-slate-400 mb-8">One-way mathematical fingerprints. Data goes in, it never comes out.</p><div class="grid grid-cols-1 lg:grid-cols-2 gap-8"><div class="space-y-6"><div class="glass-panel p-6 rounded-xl"><h3 class="text-xl font-semibold text-emerald-400 mb-3">Not Encryption, but Crucial</h3><p class="text-slate-300 text-sm leading-relaxed mb-4">Encryption is a two-way street: you encrypt to decrypt later. <strong>Hashing is a one-way street.</strong></p><p class="text-slate-300 text-sm leading-relaxed mb-4">A hash function takes an input of ANY size (a password, a 50GB video file) and mathematically condenses it into a fixed-size string of characters (a "fingerprint").</p><h4 class="font-bold text-white mt-4 mb-2">Properties of a good Hash:</h4><ul class="list-disc pl-5 text-sm text-slate-300 space-y-2"><li><strong>Deterministic:</strong> The same input ALWAYS produces the exact same hash.</li><li><strong>Irreversible:</strong> You cannot derive the input from the hash.</li><li><strong>The Avalanche Effect:</strong> Changing a single letter or even a single bit of the input changes the entire resulting hash completely.</li><li><strong>Collision Resistant:</strong> It is statistically improbable for two different inputs to produce the same hash.</li></ul></div></div><div class="glass-panel p-6 rounded-xl"><h3 class="text-xl font-semibold text-white mb-4">The Avalanche Visualizer</h3><label class="block text-sm font-medium text-slate-400 mb-2">Input Data</label><input type="text" id="hash-input" class="w-full bg-slate-900 border border-slate-700 rounded p-3 text-white font-mono text-sm focus:border-cyan-500 focus:outline-none mb-6" value="password" oninput="updateHashes()"><div class="space-y-4"><div><label class="flex justify-between text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider"><span>SHA-1</span><span class="text-red-400">Depreciated (Insecure)</span></label><div id="hash-sha1" class="w-full bg-slate-900 border border-slate-700 rounded p-3 hash-block font-mono text-[11px] break-all"></div></div><div><label class="flex justify-between text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider"><span>SHA-256</span><span class="text-emerald-400">Industry Standard</span></label><div id="hash-sha256" class="w-full bg-slate-900 border border-slate-700 rounded p-3 hash-block font-mono text-[11px] break-all"></div></div><div><label class="flex justify-between text-xs font-semibold text-slate-400 mb-1 uppercase tracking-wider"><span>SHA-512</span><span class="text-cyan-400">High Security</span></label><div id="hash-sha512" class="w-full bg-slate-900 border border-slate-700 rounded p-3 hash-block font-mono text-[11px] break-all"></div></div></div><p class="text-xs text-slate-500 mt-4 italic">Try changing "password" to "Password" (capital P) and watch how completely different every output becomes.</p></div></div></div>
                <div id="sec-ctf" class="section max-w-4xl mx-auto"><h2 class="text-3xl md:text-4xl font-bold text-white mb-2 text-center">Capture The Flag</h2><p class="text-slate-400 mb-8 text-center">Test your skills. Use the tools in the sidebar to decode these intercepted messages.</p><div class="space-y-6"><div class="glass-panel p-6 rounded-xl border-l-4 border-l-blue-500" id="chal-1"><div class="flex justify-between items-start mb-4"><h3 class="text-xl font-bold text-white">Level 1: The Roman General</h3><span class="bg-blue-900/50 text-blue-400 text-xs px-2 py-1 rounded font-bold uppercase tracking-widest">Easy</span></div><p class="text-slate-300 text-sm mb-4">We intercepted this message from an amateur hacker group. We suspect they are using the oldest trick in the book. Use the brute force tool to find the flag.</p><div class="bg-slate-900 p-3 rounded font-mono text-emerald-400 text-sm mb-4 tracking-widest text-center border border-slate-700">IODJ{KHOOR_DJHQW}</div><div class="flex gap-2"><input type="text" id="flag-1" placeholder="Enter decoded text here..." class="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white text-sm focus:border-blue-500 focus:outline-none uppercase"><button onclick="checkFlag(1, 'FLAG{HELLO_AGENT}')" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded text-sm font-bold transition">Submit</button></div></div><div class="glass-panel p-6 rounded-xl border-l-4 border-l-purple-500" id="chal-2"><div class="flex justify-between items-start mb-4"><h3 class="text-xl font-bold text-white">Level 2: Polyalphabetic Panic</h3><span class="bg-purple-900/50 text-purple-400 text-xs px-2 py-1 rounded font-bold uppercase tracking-widest">Medium</span></div><p class="text-slate-300 text-sm mb-4">The adversary got slightly smarter. They used a Vigenère cipher. We managed to recover the keyword from their garbage bin: <strong>SECURE</strong>.</p><div class="bg-slate-900 p-3 rounded font-mono text-emerald-400 text-sm mb-4 tracking-widest text-center border border-slate-700">XPER{TFRQ_TGLYVXZ}</div><div class="flex gap-2"><input type="text" id="flag-2" placeholder="Enter decoded text here..." class="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white text-sm focus:border-purple-500 focus:outline-none uppercase"><button onclick="checkFlag(2, 'FLAG{BANK_ROBBERY}')" class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded text-sm font-bold transition">Submit</button></div></div><div class="glass-panel p-6 rounded-xl border-l-4 border-l-red-500" id="chal-3"><div class="flex justify-between items-start mb-4"><h3 class="text-xl font-bold text-white">Level 3: Modern Data Extraction</h3><span class="bg-red-900/50 text-red-400 text-xs px-2 py-1 rounded font-bold uppercase tracking-widest">Hard</span></div><p class="text-slate-300 text-sm mb-4">This file was downloaded from a secure server. It's AES-GCM encrypted. A note attached to it said: <em>"The password is the name of our solar system's star, all lowercase."</em></p><textarea readonly class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-emerald-400 font-mono text-xs mb-4 h-20 break-all">xZtZc1y+j3V4D17/Zf+E4XbH8i4gD2T/1X0O1Qx7r2MhO4D5i5M2n0p9s1D/rY5X2E3P0F0I7H2Q5B9A0N1C8U6V</textarea><p class="text-xs text-slate-500 mb-4">(Note: To make this workable in this lab, use the text below, which was generated with the actual lab's AES tool using the password "sun")</p><div class="bg-slate-900 p-2 rounded font-mono text-cyan-400 text-[10px] mb-4 break-all border border-slate-700" id="chal3-base64"></div><div class="flex gap-2"><input type="text" id="flag-3" placeholder="Enter decrypted text..." class="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white text-sm focus:border-red-500 focus:outline-none"><button onclick="checkFlag(3, 'FLAG{AES_IS_SECURE}')" class="bg-red-600 hover:bg-red-500 text-white px-4 py-2 rounded text-sm font-bold transition">Submit</button></div></div></div><div class="mt-12 text-center text-slate-500 text-sm"><p>Completed all challenges? You've proven you understand the fundamentals of Cryptography!</p></div></div>

            <script>
                const tabs = ['intro', 'caesar', 'vigenere', 'aes', 'rsa', 'hashing', 'ctf']; let rsaKeyPair = null;
                function switchTab(tabId) { tabs.forEach(t => { document.getElementById(`sec-${t}`).classList.remove('active'); document.getElementById(`nav-${t}`).classList.remove('active'); }); document.getElementById(`sec-${tabId}`).classList.add('active'); document.getElementById(`nav-${tabId}`).classList.add('active'); window.scrollTo(0,0); }
                function showToast(msg, type = 'success') { const toast = document.getElementById('toast'); toast.textContent = msg; toast.className = `fixed bottom-4 right-4 px-6 py-3 rounded shadow-lg transition-opacity duration-300 z-50 text-white font-semibold ${type === 'error' ? 'bg-red-600' : 'bg-emerald-600'}`; toast.style.opacity = '1'; setTimeout(() => { toast.style.opacity = '0'; }, 4000); }
                function toggleVisibility(id) { const input = document.getElementById(id); input.type = input.type === "password" ? "text" : "password"; }

                async function getAESKey(password, salt) { const enc = new TextEncoder(); const keyMaterial = await window.crypto.subtle.importKey( "raw", enc.encode(password), {name: "PBKDF2"}, false, ["deriveKey"] ); return window.crypto.subtle.deriveKey( { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" }, keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"] ); }

            <div class="slide" id="slide-2"><div class="slide-layout"><div class="slide-content"><h2><i class="fa-solid fa-user-astronaut"></i> What is Cybersecurity?</h2><ul><li><strong>Digital Armor:</strong> It's the practice of protecting your devices, personal information, and online identity.</li><li><strong>Why it matters:</strong> Cybercriminals actively look for stolen info to use for scams, bullying, and theft.</li><li><strong>Your role:</strong> You are the very first line of defense against online threats!</li></ul></div><div class="slide-image"><img src="https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=800&q=80" onerror="this.onerror=null; this.src='https://picsum.photos/seed/cyber/800/600';" alt="Cybersecurity Code"></div></div></div>

        function loadPage(index) {
            viewer.srcdoc = document.getElementById(templates[index]).innerHTML;
            btn.textContent = `Switch View (${index + 1}/3)`;
            
            // Re-focus the iframe so keyboard arrows work immediately without needing to click
            viewer.onload = () => {
                viewer.contentWindow.focus();
            };
        }

        // Cycle on click
        btn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % templates.length;
            loadPage(currentIndex);
        });

        // Initialize first app
        loadPage(0);
    </script>
</body>
</html>
