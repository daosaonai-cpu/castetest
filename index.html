<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS Access & Database Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        /* Hide default radio circle and use custom styling */
        input[type="radio"] {
            accent-color: #3b82f6;
            width: 1.25rem;
            height: 1.25rem;
            margin-right: 0.75rem;
            cursor: pointer;
        }
        input[type="radio"]:disabled {
            cursor: default;
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen py-10">

    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
        
        <!-- Header -->
        <div class="bg-white rounded-2xl shadow-lg p-8 mb-8 text-center border-t-8 border-blue-600">
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-gray-900 mb-4">MS Access & Database Quiz</h1>
            <p class="text-lg text-gray-600">Test your knowledge with these database questions. Select your answers and click "Submit Quiz" at the bottom to see your score.</p>
        </div>

        <!-- Result Box (Hidden by default) -->
        <div id="result-box" class="hidden bg-white rounded-2xl shadow-lg p-8 mb-8 text-center border-2 border-blue-500 transform transition-all duration-500 scale-95 opacity-0">
            <h2 class="text-3xl font-bold text-gray-900 mb-2">Quiz Completed!</h2>
            <p class="text-2xl text-gray-700">Your Score: <span id="score-display" class="font-extrabold text-blue-600 text-4xl ml-2"></span></p>
            <p id="feedback-text" class="mt-4 text-lg font-medium text-gray-500"></p>
        </div>

        <!-- Quiz Container -->
        <form id="quiz-form" class="space-y-6">
            <div id="questions-container" class="space-y-6">
                <!-- Questions will be injected here by JavaScript -->
            </div>

            <!-- Submit Button -->
            <div class="bg-white rounded-2xl shadow-lg p-6 text-center mt-8">
                <button type="button" onclick="submitQuiz()" id="submit-btn" class="w-full sm:w-auto px-8 py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition duration-300 text-lg focus:outline-none focus:ring-4 focus:ring-blue-300">
                    Submit Quiz
                </button>
            </div>
        </form>

    </div>

    <script>
        // Quiz Data extracted from the prompt with reasonable correct answers
        const quizData = [
            {
                qNum: 23,
                question: "An organized collection of logically related data is known as.",
                options: { A: "Data", B: "Meta Data", C: "Database", D: "Information" },
                correct: "C"
            },
            {
                qNum: 24,
                question: "Which of the following is not a type of relationship that can be applied in Access database.",
                options: { A: "One to One", B: "One to Many", C: "Many to may", D: "All of these" },
                correct: "C"
            },
            {
                qNum: 25,
                question: "Which field type will you select when creating a new table if you require to enter long text in that field.",
                options: { A: "Text", B: "Memo", C: "Currency", D: "Hyperlink" },
                correct: "B"
            },
            {
                qNum: 26,
                question: "Shortcut key to create new database.",
                options: { A: "Ctrl+Shift+S", B: "Ctrl+New", C: "Ctrl+N", D: "Shift+N" },
                correct: "C"
            },
            {
                qNum: 27,
                question: "Which of the field has width 8 bytes?",
                options: { A: "Memo", B: "Date/Time", C: "Number", D: "Hyperlink" },
                correct: "B"
            },
            {
                qNum: 28,
                question: "Well-known database management system produced by Microsoft is?",
                options: { A: "Microsoft Access", B: "Microsoft Powerpoint", C: "Microsoft Edge", D: "MS Paint" },
                correct: "A"
            },
            {
                qNum: 29,
                question: "Help Menu.",
                options: { A: "F2", B: "Ctrl+F1", C: "F1", D: "Ctrl+H" },
                correct: "C"
            },
            {
                qNum: 30,
                question: "A database object in MS Access that stores a question about the data in database?",
                options: { A: "Forms", B: "Table", C: "Query", D: "Report" },
                correct: "C"
            },
            {
                qNum: 31,
                question: "It is most common type of query. It retrieves records from one or more tables and then...",
                options: { A: "Parameter", B: "Select", C: "crosstab", D: "All of above" },
                correct: "B"
            },
            {
                qNum: 32,
                question: "Which of the following term is least related to database?",
                options: { A: "Attributes", B: "Tuples", C: "Columns", D: "Relationship" },
                correct: "D" 
            },
            {
                qNum: 33,
                question: "In a database table, the category of information is called.",
                options: { A: "tuple", B: "field", C: "record", D: "All of above" },
                correct: "B"
            },
            {
                qNum: 34,
                question: "Which of the following is not a database object?",
                options: { A: "Table", B: "Form", C: "Worksheet", D: "Modules" },
                correct: "C"
            },
            {
                qNum: 35,
                question: "What is a relation in RDBMS?",
                options: { A: "Table", B: "Key", C: "Data Types", D: "Row" },
                correct: "A"
            },
            {
                qNum: 36,
                question: "This key uniquely identifies each record.",
                options: { A: "Field Name", B: "Key Record", C: "Unique Key", D: "primary key" },
                correct: "D"
            },
            {
                qNum: 37,
                question: "The command center of access file that appears when you create or open the MS Access database file.",
                options: { A: "Database Window", B: "Quesry Window", C: "Design View window", D: "Switchboard" },
                correct: "A"
            },
            {
                qNum: 63,
                question: "The size of a field with number data type cannot be.",
                options: { A: "2", B: "4", C: "8", D: "16" },
                correct: "D"
            },
            {
                qNum: 67,
                question: "The Yes/No data type is...",
                options: { A: "1 bit", B: "1 byte", C: "1 Character", D: "1 Kb" },
                correct: "A"
            },
            {
                qNum: 69,
                question: "In which method we dont need to specify the field type and size while creating a new table?",
                options: { A: "Design View", B: "While using Wizard", C: "Create Table By Entering Data", D: "All of them" },
                correct: "C"
            },
            {
                qNum: 71,
                question: "In Access, _____ are used to store the data.",
                options: { A: "Query", B: "Form", C: "Report", D: "Table" },
                correct: "D"
            },
            {
                qNum: 72,
                question: "Conditional formatting tool is present in _______ tab.",
                options: { A: "Home", B: "View", C: "Developer", D: "Add-ins" },
                correct: "A"
            },
            {
                qNum: 73,
                question: "Which of the following is used to view, analyze, or modify data in an Access database?",
                options: { A: "Query", B: "Modules", C: "Form", D: "Report" },
                correct: "C"
            },
            {
                qNum: 74,
                question: "Which of the following is NOT a standard logical database model?",
                options: { A: "Network Database Model", B: "RDBMS", C: "ORDBMS", D: "OODBMS" },
                correct: "C"
            },
            {
                qNum: 75,
                question: "Which of the following is a conditional function in Excel?",
                options: { A: "MAX()", B: "COUNT()", C: "IF()", D: "AVERAGE()" },
                correct: "C"
            },
            {
                qNum: 76,
                question: "Which feature is used to send identical documents to multiple recipients?",
                options: { A: "Document formatting", B: "Database management", C: "Mail merge", D: "Form letters" },
                correct: "C"
            },
            {
                qNum: 77,
                question: "Database security and access management typically involve:",
                options: { A: "User ID", B: "Password", C: "Status", D: "All of these" },
                correct: "D"
            },
            {
                qNum: 78,
                question: "The layout configuration of a document page is done through:",
                options: { A: "Page Setup", B: "Page formatting", C: "Page alignment", D: "Page Layout" },
                correct: "A"
            },
            {
                qNum: 79,
                question: "What is a Document Outline View?",
                options: { A: "A preview in a full screen", B: "A view with a structure of heading at various levels", C: "A preview with margins", D: "A View with a margins and gutter" },
                correct: "B"
            },
            {
                qNum: 80,
                question: "What aspects should be considered while creating a presentation?",
                options: { A: "Clarity", B: "Effectiveness", C: "File size", D: "All of them" },
                correct: "D"
            },
            {
                qNum: 81,
                question: "What is a Form in Access?",
                options: { A: "It is used to take printout of a form from Access Tables", B: "It is an input screen for viewing and entering data", C: "It is used for storing special data other than text (e.g. photo)", D: "It's optional We can use Report instead of Form" },
                correct: "B"
            },
            {
                qNum: 90,
                question: "what can be the maximum length of a text field?",
                options: { A: "120", B: "255", C: "265", D: "75" },
                correct: "B"
            }
        ];

        // Function to render the quiz dynamically
        function renderQuiz() {
            const container = document.getElementById('questions-container');
            
            quizData.forEach((q, index) => {
                // Create question card
                const questionDiv = document.createElement('div');
                questionDiv.className = "bg-white rounded-2xl shadow-sm p-6 sm:p-8 border border-gray-200 transition-all hover:shadow-md";
                
                // Question Header
                const questionHeader = document.createElement('h3');
                questionHeader.className = "text-xl font-semibold text-gray-800 mb-4 flex items-start";
                questionHeader.innerHTML = `<span class="bg-blue-100 text-blue-800 text-sm font-bold px-3 py-1 rounded-full mr-3 mt-1">Q${q.qNum}</span> <span>${q.question}</span>`;
                questionDiv.appendChild(questionHeader);

                // Options Container
                const optionsDiv = document.createElement('div');
                optionsDiv.className = "space-y-3 pl-2 sm:pl-12";

                const optionsList = ['A', 'B', 'C', 'D'];
                optionsList.forEach(opt => {
                    const labelId = `label-q${q.qNum}-${opt}`;
                    const inputId = `q${q.qNum}-${opt}`;

                    // Option Label
                    const label = document.createElement('label');
                    label.id = labelId;
                    label.className = "flex items-center w-full p-4 border-2 border-gray-100 rounded-xl cursor-pointer hover:bg-blue-50 hover:border-blue-200 transition-colors duration-200 group";
                    label.setAttribute('for', inputId);

                    // Radio Input
                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = `q${q.qNum}`;
                    radio.id = inputId;
                    radio.value = opt;

                    // Option Text
                    const span = document.createElement('span');
                    span.className = "text-base font-medium text-gray-700 group-hover:text-blue-700";
                    span.textContent = `${opt}) ${q.options[opt]}`;

                    label.appendChild(radio);
                    label.appendChild(span);
                    optionsDiv.appendChild(label);
                });

                questionDiv.appendChild(optionsDiv);
                container.appendChild(questionDiv);
            });
        }

        // Function to submit and calculate score
        function submitQuiz() {
            let score = 0;
            const totalQuestions = quizData.length;

            quizData.forEach(q => {
                const optionsList = ['A', 'B', 'C', 'D'];
                
                // Find selected option
                const selectedInput = document.querySelector(`input[name="q${q.qNum}"]:checked`);
                const selectedValue = selectedInput ? selectedInput.value : null;

                // Evaluate score
                if (selectedValue === q.correct) {
                    score++;
                }

                // Update UI for each option
                optionsList.forEach(opt => {
                    const label = document.getElementById(`label-q${q.qNum}-${opt}`);
                    const input = document.getElementById(`q${q.qNum}-${opt}`);
                    
                    // Disable inputs after submission
                    input.disabled = true;
                    
                    // Reset base classes for evaluation state
                    label.className = "flex items-center w-full p-4 border-2 rounded-xl transition-all duration-300 ";

                    if (opt === q.correct) {
                        // Highlight correct answer in Green
                        label.classList.add("bg-green-100", "border-green-500");
                        label.querySelector('span').classList.add("text-green-900", "font-bold");
                        
                        // Add checkmark icon (Optional UI enhancement)
                        const checkMark = document.createElement('span');
                        checkMark.innerHTML = "✓";
                        checkMark.className = "ml-auto text-green-600 font-extrabold text-xl";
                        label.appendChild(checkMark);

                    } else if (opt === selectedValue && selectedValue !== q.correct) {
                        // Highlight wrong selection in Red
                        label.classList.add("bg-red-100", "border-red-500");
                        label.querySelector('span').classList.add("text-red-900", "font-bold");
                        
                        // Add cross icon
                        const crossMark = document.createElement('span');
                        crossMark.innerHTML = "✗";
                        crossMark.className = "ml-auto text-red-600 font-extrabold text-xl";
                        label.appendChild(crossMark);
                    } else {
                        // Dim unselected wrong options
                        label.classList.add("bg-gray-50", "border-gray-200", "opacity-60");
                        label.querySelector('span').classList.add("text-gray-500");
                    }
                });
            });

            // Display Results
            const resultBox = document.getElementById('result-box');
            const scoreDisplay = document.getElementById('score-display');
            const feedbackText = document.getElementById('feedback-text');
            const submitBtn = document.getElementById('submit-btn');

            scoreDisplay.textContent = `${score} / ${totalQuestions}`;
            
            // Set feedback based on score
            const percentage = (score / totalQuestions) * 100;
            if (percentage === 100) {
                feedbackText.textContent = "Perfect! You're a database master!";
                feedbackText.className = "mt-4 text-lg font-bold text-green-600";
            } else if (percentage >= 70) {
                feedbackText.textContent = "Great job! You have a solid understanding.";
                feedbackText.className = "mt-4 text-lg font-bold text-blue-600";
            } else if (percentage >= 40) {
                feedbackText.textContent = "Good effort, but there is room for improvement.";
                feedbackText.className = "mt-4 text-lg font-bold text-yellow-600";
            } else {
                feedbackText.textContent = "Keep studying! Review the highlighted correct answers below.";
                feedbackText.className = "mt-4 text-lg font-bold text-red-500";
            }

            // Show result box with animation
            resultBox.classList.remove('hidden');
            setTimeout(() => {
                resultBox.classList.remove('scale-95', 'opacity-0');
                resultBox.classList.add('scale-100', 'opacity-100');
            }, 10);

            // Hide or disable submit button
            submitBtn.textContent = "Quiz Completed";
            submitBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
            submitBtn.classList.add('bg-gray-400', 'cursor-not-allowed');
            submitBtn.disabled = true;

            // Scroll smoothly to the results
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initialize Quiz on window load
        window.onload = () => {
            renderQuiz();
        };

    </script>
</body>
</html>
