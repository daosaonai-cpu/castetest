<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT & Computing Fundamentals Study Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }
        .tab-active {
            border-bottom: 2px solid #3b82f6;
            color: #1d4ed8;
            font-weight: 600;
        }
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl md:text-2xl font-bold text-slate-900 flex items-center gap-2">
                    <i class="fa-solid fa-book-open text-blue-600"></i>
                    Study Guide
                </h1>
                <p class="text-xs md:text-sm text-slate-500 mt-1">IT, Database, Finance & Office Fundamentals</p>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-sm font-medium text-slate-600 bg-slate-100 px-3 py-1.5 rounded-full">
                    <span id="total-questions">0</span> Questions
                </span>
            </div>
        </div>
        
        <!-- Navigation Tabs -->
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 mt-2 overflow-x-auto no-scrollbar">
            <nav class="flex space-x-6 min-w-max" id="tabs-container">
                <!-- Tabs will be injected here by JS -->
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <div class="mb-6 flex justify-between items-center">
            <h2 id="category-title" class="text-2xl font-bold text-slate-800">Category Name</h2>
        </div>
        
        <div id="questions-container" class="space-y-6">
            <!-- Questions will be injected here by JS -->
        </div>
    </main>

    <footer class="bg-slate-900 text-slate-400 py-6 text-center text-sm mt-auto">
        <p>Extracted from "Image to PDF 20260908 10.27.58.pdf" • All correct options are marked in green.</p>
    </footer>

    <script>
        // Data Structure holding all extracted questions
        const quizData = [
            {
                id: "photoshop",
                title: "Image Editing (Photoshop)",
                icon: "fa-image",
                questions: [
                    { no: "2", text: "Which tool is used to fill single color in background?", options: ["Gradient Tool", "Paint Bucket Tool", "Paint Bucket Tool", "Background Tool"], correct: 1 },
                    { no: "3", text: "The name of the areas that include the color swatches, layers and toolbox?", options: ["layer", "layer effect", "blending option", "pallette"], correct: 3 },
                    { no: "4", text: "If you have a solid color to select and delete, the tool is the quickest and most effective.", options: ["magic wand", "color picker", "zoom", "none"], correct: 0 },
                    { no: "5", text: "To cut down the size of the entire graphic design, including all layers, you should select the tool.", options: ["marquee", "magic wand", "eraser", "crop"], correct: 3 },
                    { no: "7", text: "What is File Extension in Photoshop?", options: ["Bmp", "Tiff", "Psd", "Txt"], correct: 2 },
                    { no: "8", text: "Which tool is used to light the pixels of the image in Photoshop.", options: ["Smudge", "Sharpen", "Burn", "Dodge"], correct: 3 },
                    { no: "9", text: "Twirl, ripple and spherize are examples of distortion...", options: ["filters", "blending options", "image adjustments", "layer modes"], correct: 0 },
                    { no: "11", text: "There are how many types of 2D graphics?", options: ["2 (Raster and Vector)", "3", "4", "5"], correct: 0 },
                    { no: "12", text: "To delete a series of steps that have been used in a graphic design, you would need to use the...", options: ["layer", "action", "history", "path"], correct: 2 },
                    { no: "13", text: "Drop shadow, inner glow and bevel are examples of..... you need to use with text.", options: ["filters", "blending options", "image adjustments", "layer modes"], correct: 1 },
                    { no: "14", text: "When did Photoshop start?", options: ["1985", "1986", "1987", "1988"], correct: 2 },
                    { no: "15", text: "The images are made of.", options: ["DPI", "Pixels", "Drawing", "Pictures"], correct: 1 },
                    { no: "16", text: "What is the meaning of CMYK?", options: ["Cream Magenta Yellow Kole", "Cyan Magenta Yellow Blue", "Cyan Magenta Yellow Black", "Cyan Magenta Yellow Brown"], correct: 2 },
                    { no: "18", text: "JPEG stands for?", options: ["Joint Photographic Experts Group", "Joint Photographic Exports Group", "Join Photographic Experts Group", "none"], correct: 0 },
                    { no: "19", text: "For What work Photoshop is used?", options: ["For Graphics", "For Animation", "For Typing", "For Programming"], correct: 0 },
                    { no: "20", text: "The.... tool in best selected when your need to select an abnormally shaped image.", options: ["marquee", "lasso", "magic wand", "clone stamp"], correct: 1 },
                    { no: "21", text: "Which one of these formats is not an image format?", options: ["EPS", "PCX", "WPG", "DPI (DPI is a measurement)"], correct: 3 },
                    { no: "22", text: "Which of these formats supports Transparency?", options: ["Jpeg", "Png", "Gif", "Jpg"], correct: 1 }
                ]
            },
            {
                id: "database",
                title: "Database & MS Access",
                icon: "fa-database",
                questions: [
                    { no: "23", text: "An organized collection of logically related data is known as.", options: ["Data", "Meta Data", "Database", "Information"], correct: 2 },
                    { no: "25", text: "Which field type will you select when creating a new table if you require to enter long text in that field.", options: ["Text", "Memo", "Currency", "Hyperlink"], correct: 1 },
                    { no: "26", text: "Shortcut key to create new database.", options: ["Ctrl+Shift+S", "Ctrl+New", "Ctrl+N", "Shift+N"], correct: 2 },
                    { no: "27", text: "Which of the field has width 8 bytes?", options: ["Memo", "Date/Time", "Number", "Hyperlink"], correct: 1 },
                    { no: "28", text: "Well-known database management system produced by Microsoft is?", options: ["Microsoft Access", "Microsoft Powerpoint", "Microsoft Edge", "MS Paint"], correct: 0 },
                    { no: "29", text: "Help Menu", options: ["F2", "Ctrl+F1", "F1", "Ctrl+H"], correct: 2 },
                    { no: "30", text: "A database object in MS Access that stores a question about the data in database?", options: ["Forms", "Table", "Query", "Report"], correct: 2 },
                    { no: "31", text: "It is most common type of query. It retrieves records from one or more tables and then...", options: ["Parameter", "Select", "crosstab", "All of above"], correct: 1 },
                    { no: "33", text: "In a database table, the category of information is called.", options: ["tuple", "field", "record", "All of above"], correct: 1 },
                    { no: "34", text: "Which of the following is not a database object?", options: ["Table", "Form", "Worksheet", "Modules"], correct: 2 },
                    { no: "35", text: "What is a relation in RDBMS?", options: ["Table", "Key", "Data Types", "Row"], correct: 0 },
                    { no: "36", text: "This key uniquely identifies each record.", options: ["Field Name", "Key Record", "Unique Key", "primary key"], correct: 3 },
                    { no: "37", text: "The command center of access file that appears when you create or open the MS Access database file.", options: ["Database Window", "Quesry Window", "Design View window", "Switchboard"], correct: 0 },
                    { no: "63", text: "The size of a field with number data type cannot be.", options: ["2", "4", "8", "16"], correct: 3 },
                    { no: "67", text: "The Yes/No data type is...", options: ["1 bit", "1 byte", "1 Character", "1 Kb"], correct: 0 }
                ]
            },
            {
                id: "financial",
                title: "Digital Financial Services",
                icon: "fa-money-bill-wave",
                questions: [
                    { no: "38", text: "Who started the ATM card first?", options: ["SBI", "HDFC", "HSBC", "ICICI"], correct: 2 },
                    { no: "39", text: "IFS Code is a _ digit code.", options: ["7", "9", "11", "15"], correct: 2 },
                    { no: "40", text: "The number of digits printed on ATM Debit cart is.", options: ["10", "16", "11", "13"], correct: 1 },
                    { no: "41/57", text: "USSD was launched by?", options: ["RBI", "SBI", "Bank of Baroda", "Union Bank of India"], correct: 3 },
                    { no: "42", text: "From what date all banks have started to share their ATM cost for the transaction?", options: ["September 1 2009", "January 1 2009", "April 1 2009", "March 1 2009"], correct: 2 },
                    { no: "43", text: "UTR means.", options: ["Uniquely Transaction Reference", "Unique Transaction Reference", "Unique Transfer Reference", "None of the above"], correct: 1 },
                    { no: "44", text: "RTGS stands for.", options: ["Real Time Gross Sale", "Real Time Gross Settlement", "Real Time Growth Settlement", "Real Time Group Service"], correct: 1 },
                    { no: "45", text: "Which type of deposits earns highest interest rate.", options: ["Saving account", "Current account", "Fixed deposits"], correct: 2 },
                    { no: "46/56", text: "What is the full form of USSD.", options: ["Unstructured Supplementary Service Data", "Unstructured Supplementary Service Date", "Unstructured System Service Data", "Unstructured System Service Date"], correct: 0 },
                    { no: "47", text: "Under, PMSBY, accidental death claim is available for.", options: ["1 lakh", "2 lakh", "3 lakh", "4 lakh"], correct: 1 },
                    { no: "48", text: "Payment Gateway refers to-", options: ["Authorising payment for e-business", "to resolve financial disputes", "Networking switch", "None of the above"], correct: 0 },
                    { no: "49", text: "UPI was launched by whom.", options: ["R. Gandhi", "urjit patel", "Dr. Raghuram G Rajan", "SS mundra"], correct: 2 },
                    { no: "50", text: "On which year NEFT start in India.", options: ["2002", "2004", "2005", "2006"], correct: 2 },
                    { no: "51", text: "AEPS stands for:", options: ["Aadhaar Enabled Payment source", "Aadhaar Enrolled Payment System", "Aadhaar Enabled Payment system", "None of the above"], correct: 2 },
                    { no: "52", text: "Identify the true statement with respect to IMPS.", options: ["the charges for remittances through IMPS are decided by NPCI", "In IMPS once a payment is initialed it cannot be stopped", "IMPS are not available on Sunday", "all are true"], correct: 1 },
                    { no: "54", text: "How many digits does an American CVV have?", options: ["3", "4", "5", "6"], correct: 1 },
                    { no: "55", text: "What is the full form of POS.", options: ["Point of Sale", "Point of Service", "Point of Security", "None of the above"], correct: 0 },
                    { no: "58", text: "Which bank started Pocket wallet.", options: ["HDFC", "SBI", "ICICI", "HSBC"], correct: 2 },
                    { no: "59A", text: "The IFSC has _ digit code and _ alpha characters.", options: ["13 digit code and 6 alpha character", "11 digit code and 4 alpha characters", "11", "12"], correct: 1 },
                    { no: "60", text: "Instant money transfer under IMPS is available on how many days in a week.", options: ["4", "5", "6", "7"], correct: 3 },
                    { no: "61", text: "Which is not required for accessing the service of PoS system?", options: ["PIN", "Internet", "Debit/Credit Card", "Account Number"], correct: 3 },
                    { no: "62", text: "Full form of IFSC.", options: ["Indian Financial System Control", "Indian Financial System Code", "Indian Financial Structure Control", "Indian Financial Structure Code"], correct: 1 }
                ]
            },
            {
                id: "office",
                title: "Office Automation",
                icon: "fa-file-word",
                questions: [
                    { no: "64", text: "Which of the following is the shortcut key to insert a new slide between the current presentation.", options: ["Ctrl+N", "Ctrl+K", "Ctrl+M", "Ctrl+O"], correct: 2 },
                    { no: "65", text: "Which commands are present in Quick Access Toolbar.", options: ["Save", "Undo", "Redo", "All of them"], correct: 3 },
                    { no: "66", text: "Which can be used for quick access to commonly used commands and tools.", options: ["Status bar", "Toolbar", "Menu bar", "Title bar"], correct: 1 },
                    { no: "70", text: "A collection of worksheets is called.", options: ["Spreadsheets", "Sheets", "Workbook", "Work sheets"], correct: 2 },
                    { no: "82", text: "WYSIWYG stands for.", options: ["What You See Is What You Get", "What You Seek Is What You Get", "What You See Is What You Give", "What You Seek Is What You Give"], correct: 0 },
                    { no: "83", text: "Which of the following is the file extension of the PowerPoint application.", options: [".ppt", ".jpg", ".html", ".doc"], correct: 0 },
                    { no: "84", text: "The cell in which you are currently working on is the.", options: ["Current Cell", "Present Cell", "Active Cell", "Active table"], correct: 2 },
                    { no: "87", text: "Microsoft Word is a... application.", options: ["Application", "Compiler", "System", "Programming"], correct: 0 },
                    { no: "88", text: "In a Mail merge, data sources data or information is a.", options: ["Constant", "Variable", "Conditional", "None of these"], correct: 1 }
                ]
            }
        ];

        let currentCategory = quizData[0].id;
        const labels = ['A', 'B', 'C', 'D'];

        // Initialize App
        function init() {
            renderTabs();
            renderCategory(currentCategory);
            
            // Calculate total questions
            const total = quizData.reduce((acc, cat) => acc + cat.questions.length, 0);
            document.getElementById('total-questions').textContent = total;
        }

        // Render Navigation Tabs
        function renderTabs() {
            const tabsContainer = document.getElementById('tabs-container');
            tabsContainer.innerHTML = '';
            
            quizData.forEach(cat => {
                const isActive = cat.id === currentCategory;
                const tab = document.createElement('button');
                
                tab.className = `pb-4 px-1 text-sm md:text-base whitespace-nowrap transition-colors duration-200 flex items-center gap-2 ${isActive ? 'tab-active' : 'text-slate-500 hover:text-slate-700 border-b-2 border-transparent hover:border-slate-300'}`;
                
                tab.innerHTML = `<i class="fa-solid ${cat.icon}"></i> ${cat.title} <span class="bg-slate-100 text-slate-500 text-xs px-2 py-0.5 rounded-full ml-1 font-normal">${cat.questions.length}</span>`;
                
                tab.onclick = () => {
                    currentCategory = cat.id;
                    renderTabs(); // Update active state
                    renderCategory(currentCategory);
                };
                
                tabsContainer.appendChild(tab);
            });
        }

        // Render Questions for the selected category
        function renderCategory(categoryId) {
            const category = quizData.find(c => c.id === categoryId);
            document.getElementById('category-title').innerHTML = `<i class="fa-solid ${category.icon} mr-2 text-blue-500"></i>${category.title}`;
            
            const container = document.getElementById('questions-container');
            container.innerHTML = ''; // Clear current
            
            category.questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden fade-in';
                // stagger animation slightly
                card.style.animationDelay = `${index * 0.05}s`;
                card.style.animationFillMode = 'both';
                
                let optionsHtml = '';
                q.options.forEach((opt, optIndex) => {
                    const isCorrect = optIndex === q.correct;
                    
                    // Style classes based on whether it is the correct option
                    const baseClass = "flex items-center p-3 rounded-lg border-2 mb-2 last:mb-0 transition-all";
                    const normalClass = "border-slate-100 bg-slate-50 text-slate-600";
                    const correctClass = "border-green-500 bg-green-50 text-green-800 font-semibold shadow-sm";
                    
                    const labelBaseClass = "flex items-center justify-center w-8 h-8 rounded-md mr-3 font-bold text-sm shrink-0";
                    const labelNormalClass = "bg-white text-slate-500 border border-slate-200";
                    const labelCorrectClass = "bg-green-500 text-white border border-green-600 shadow-sm";

                    optionsHtml += `
                        <div class="${baseClass} ${isCorrect ? correctClass : normalClass}">
                            <div class="${labelBaseClass} ${isCorrect ? labelCorrectClass : labelNormalClass}">
                                ${labels[optIndex]}
                            </div>
                            <span class="flex-grow">${opt}</span>
                            ${isCorrect ? '<i class="fa-solid fa-circle-check text-green-500 text-xl ml-2 shrink-0"></i>' : ''}
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="p-5 md:p-6 bg-slate-50/50 border-b border-slate-100 flex items-start gap-4">
                        <div class="bg-blue-100 text-blue-700 font-bold w-10 h-10 rounded-full flex items-center justify-center shrink-0">
                            ${q.no}
                        </div>
                        <h3 class="text-lg font-medium text-slate-800 pt-1 leading-snug">
                            ${q.text}
                        </h3>
                    </div>
                    <div class="p-5 md:p-6 bg-white">
                        ${optionsHtml}
                    </div>
                `;
                
                container.appendChild(card);
            });
        }

        // Run init on load
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
