<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined Image Formatter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .drop-zone { border: 2px dashed #9ca3af; transition: all 0.3s ease; }
        .drop-zone.dragover { border-color: #4f46e5; background-color: #e0e7ff; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <main class="w-full max-w-3xl bg-white rounded-xl shadow-lg p-6 md:p-8">
        
        <!-- Toggle Switch -->
        <div class="flex justify-center mb-8">
            <div class="bg-gray-100 p-1 rounded-lg inline-flex relative shadow-inner">
                <button id="modeDoc" class="px-6 py-2.5 rounded-md bg-white shadow-sm text-sm font-semibold text-indigo-700 transition-all">
                    Doc Editor (170x132)
                </button>
                <button id="modePic" class="px-6 py-2.5 rounded-md text-sm font-medium text-gray-500 hover:text-gray-700 transition-all">
                    Pic Editor (132x170)
                </button>
            </div>
        </div>

        <header class="text-center mb-6">
            <h1 id="mainTitle" class="text-2xl font-bold text-gray-800 mb-2">Document Formatter</h1>
            <p id="mainSubtitle" class="text-gray-600 text-sm">Resize to <span class="font-semibold text-indigo-600">170x132</span> pixels and compress to <span class="font-semibold text-indigo-600">5-20 KB</span> at 150 DPI.</p>
        </header>

        <div id="dropZone" class="drop-zone rounded-lg p-8 flex flex-col items-center justify-center cursor-pointer mb-6 text-center">
            <svg class="w-12 h-12 text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
            </svg>
            <p class="text-gray-700 font-medium mb-1">Drag and drop your image here</p>
            <p class="text-gray-500 text-sm mb-4">or</p>
            <label class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-md cursor-pointer transition duration-200">
                Browse Files
                <input type="file" id="fileInput" class="hidden" accept="image/png, image/jpeg, image/jpg, image/webp">
            </label>
        </div>

        <div id="errorMessage" class="hidden mb-4 p-3 bg-red-100 text-red-700 rounded-md text-sm text-center"></div>

        <div id="workspace" class="hidden">
            <div class="flex flex-col md:flex-row gap-6">
                <!-- Original Image Preview -->
                <div class="flex-1 flex flex-col items-center">
                    <h3 class="text-sm font-semibold text-gray-700 mb-2">Original</h3>
                    <div class="w-full max-w-[200px] min-h-[150px] border border-gray-200 p-2 rounded bg-gray-50 flex items-center justify-center">
                        <img id="originalPreview" src="" alt="Original Image" class="max-w-full max-h-[200px] object-contain">
                    </div>
                    <div class="mt-2 text-xs text-gray-500 text-center" id="originalStats"></div>
                </div>

                <!-- Controls and Processed Output -->
                <div class="flex-1 flex flex-col">
                    <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 mb-4">
                        <h3 class="text-sm font-semibold text-gray-700 mb-3">Adjust Quality</h3>
                        <p class="text-xs text-gray-500 mb-3" id="qualityHint">Adjust the slider to meet the KB file size requirement.</p>
                        
                        <div class="flex items-center gap-3">
                            <span class="text-xs font-medium text-gray-600">Low</span>
                            <input type="range" id="qualitySlider" min="0.1" max="1.0" step="0.05" value="0.8" class="flex-1 h-2 bg-gray-300 rounded-lg appearance-none cursor-pointer">
                            <span class="text-xs font-medium text-gray-600">High</span>
                        </div>
                        <div class="text-center mt-2 text-sm font-medium text-indigo-600">
                            Quality: <span id="qualityValue">80</span>%
                        </div>
                    </div>

                    <!-- Result Preview -->
                    <div class="flex flex-col items-center">
                         <h3 class="text-sm font-semibold text-gray-700 mb-2" id="resultTitle">Result</h3>
                         <div class="border-2 border-dashed border-gray-300 p-4 bg-gray-100 flex items-center justify-center min-h-[200px] w-full">
                            <canvas id="outputCanvas" class="border border-gray-400 bg-white shadow-sm block"></canvas>
                         </div>
                         
                         <div id="resultStats" class="mt-3 flex flex-wrap gap-2 justify-center text-xs">
                             <span id="sizeBadge" class="px-2 py-1 rounded-full bg-gray-200 text-gray-700">Size: -- KB</span>
                             <span id="dimBadge" class="px-2 py-1 rounded-full bg-green-100 text-green-700">170x132 px</span>
                             <span class="px-2 py-1 rounded-full bg-blue-100 text-blue-700">150 DPI</span>
                         </div>
                    </div>
                </div>
            </div>

            <div class="mt-8 flex justify-center gap-4 border-t pt-6">
                <button id="resetBtn" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-800 font-medium rounded-md transition duration-200">
                    Start Over
                </button>
                <button id="downloadBtn" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-md transition duration-200 shadow-md disabled:opacity-50 disabled:cursor-not-allowed">
                    Download JPG
                </button>
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Configuration for modes
            const CONFIG = {
                doc: {
                    w: 170, h: 132, minKb: 5, maxKb: 20, 
                    title: "Document Formatter", 
                    subtitle: 'Resize to <span class="font-semibold text-indigo-600">170x132</span> pixels and compress to <span class="font-semibold text-indigo-600">5-20 KB</span> at 150 DPI.',
                    filename: 'editdoc.jpg'
                },
                pic: {
                    w: 132, h: 170, minKb: 0, maxKb: 9999, // No strict KB limits for pic
                    title: "Picture Resizer", 
                    subtitle: 'Crop & Resize to <span class="font-semibold text-indigo-600">132x170</span> pixels at 150 DPI.',
                    filename: 'editpic.jpg'
                }
            };
            
            let currentMode = 'doc';
            let currentImage = null;
            let processedBlobUrl = null;

            // DOM Elements
            const modeDocBtn = document.getElementById('modeDoc');
            const modePicBtn = document.getElementById('modePic');
            const mainTitle = document.getElementById('mainTitle');
            const mainSubtitle = document.getElementById('mainSubtitle');
            
            const dropZone = document.getElementById('dropZone');
            const fileInput = document.getElementById('fileInput');
            const workspace = document.getElementById('workspace');
            const errorMessage = document.getElementById('errorMessage');
            
            const originalPreview = document.getElementById('originalPreview');
            const originalStats = document.getElementById('originalStats');
            const qualitySlider = document.getElementById('qualitySlider');
            const qualityValueDisplay = document.getElementById('qualityValue');
            
            const outputCanvas = document.getElementById('outputCanvas');
            const ctx = outputCanvas.getContext('2d');
            const resultTitle = document.getElementById('resultTitle');
            const sizeBadge = document.getElementById('sizeBadge');
            const dimBadge = document.getElementById('dimBadge');
            
            const downloadBtn = document.getElementById('downloadBtn');
            const resetBtn = document.getElementById('resetBtn');

            // --- Toggle Logic ---
            function setMode(mode) {
                currentMode = mode;
                if (mode === 'doc') {
                    modeDocBtn.className = "px-6 py-2.5 rounded-md bg-white shadow-sm text-sm font-semibold text-indigo-700 transition-all";
                    modePicBtn.className = "px-6 py-2.5 rounded-md text-sm font-medium text-gray-500 hover:text-gray-700 transition-all";
                } else {
                    modePicBtn.className = "px-6 py-2.5 rounded-md bg-white shadow-sm text-sm font-semibold text-indigo-700 transition-all";
                    modeDocBtn.className = "px-6 py-2.5 rounded-md text-sm font-medium text-gray-500 hover:text-gray-700 transition-all";
                }
                
                mainTitle.textContent = CONFIG[mode].title;
                mainSubtitle.innerHTML = CONFIG[mode].subtitle;
                resultTitle.textContent = `Result (${CONFIG[mode].w}x${CONFIG[mode].h})`;
                dimBadge.textContent = `${CONFIG[mode].w}x${CONFIG[mode].h} px`;
                
                if (currentImage) processImage();
            }

            modeDocBtn.addEventListener('click', () => setMode('doc'));
            modePicBtn.addEventListener('click', () => setMode('pic'));

            // --- File Handling ---
            ['dragover', 'dragleave', 'drop'].forEach(evt => {
                dropZone.addEventListener(evt, e => e.preventDefault());
            });

            dropZone.addEventListener('dragover', () => dropZone.classList.add('dragover'));
            dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
            dropZone.addEventListener('drop', e => {
                dropZone.classList.remove('dragover');
                if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
            });

            fileInput.addEventListener('change', e => {
                if (e.target.files.length) handleFile(e.target.files[0]);
            });

            qualitySlider.addEventListener('input', e => {
                qualityValueDisplay.textContent = Math.round(e.target.value * 100);
                if (currentImage) processImage();
            });

            resetBtn.addEventListener('click', () => {
                workspace.classList.add('hidden');
                dropZone.classList.remove('hidden');
                fileInput.value = '';
                currentImage = null;
                if (processedBlobUrl) URL.revokeObjectURL(processedBlobUrl);
                errorMessage.classList.add('hidden');
            });

            downloadBtn.addEventListener('click', () => {
                if (!downloadBtn.disabled && processedBlobUrl) {
                    const a = document.createElement('a');
                    a.href = processedBlobUrl;
                    a.download = CONFIG[currentMode].filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                }
            });

            function handleFile(file) {
                errorMessage.classList.add('hidden');
                if (!file.type.startsWith('image/')) {
                    errorMessage.textContent = "Please upload a valid image file.";
                    errorMessage.classList.remove('hidden');
                    return;
                }

                originalStats.innerHTML = `Size: ${(file.size/1024).toFixed(2)} KB<br>Type: ${file.type}`;

                const reader = new FileReader();
                reader.onload = e => {
                    originalPreview.src = e.target.result;
                    const img = new Image();
                    img.onload = () => {
                        currentImage = img;
                        dropZone.classList.add('hidden');
                        workspace.classList.remove('hidden');
                        originalStats.innerHTML += `<br>Dim: ${img.width}x${img.height}px`;
                        processImage();
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

            // --- Canvas Processing & Constraints ---
            function processImage() {
                if (!currentImage) return;

                const cfg = CONFIG[currentMode];
                outputCanvas.width = cfg.w;
                outputCanvas.height = cfg.h;
                
                ctx.fillStyle = "#FFFFFF";
                ctx.fillRect(0, 0, cfg.w, cfg.h);
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';

                // Drawing logic varies by mode
                if (currentMode === 'doc') {
                    // Stretches to fill exactly
                    ctx.drawImage(currentImage, 0, 0, cfg.w, cfg.h);
                } else {
                    // Center crop to fill (maintains aspect ratio for pics)
                    const imgRatio = currentImage.width / currentImage.height;
                    const canvasRatio = cfg.w / cfg.h;
                    let renderW = cfg.w, renderH = cfg.h, offsetX = 0, offsetY = 0;

                    if (imgRatio > canvasRatio) {
                        renderW = cfg.h * imgRatio;
                        offsetX = (cfg.w - renderW) / 2;
                    } else if (imgRatio < canvasRatio) {
                        renderH = cfg.w / imgRatio;
                        offsetY = (cfg.h - renderH) / 2;
                    }
                    ctx.drawImage(currentImage, offsetX, offsetY, renderW, renderH);
                }

                const quality = parseFloat(qualitySlider.value);
                const rawDataUrl = outputCanvas.toDataURL('image/jpeg', quality);
                const dpiDataUrl = changeDpiJpegBase64(rawDataUrl, 150);
                
                const blob = dataURItoBlob(dpiDataUrl);
                const sizeInKb = (blob.size / 1024).toFixed(2);
                
                sizeBadge.textContent = `Size: ${sizeInKb} KB`;

                // Validation based on mode config
                if (currentMode === 'doc') {
                    if (sizeInKb < cfg.minKb) {
                        setSizeBadgeState('red', 'Too Small');
                    } else if (sizeInKb > cfg.maxKb) {
                        setSizeBadgeState('red', 'Too Large');
                    } else {
                        setSizeBadgeState('green', 'Valid');
                    }
                } else {
                    setSizeBadgeState('green', 'Valid'); // Pics have no size constraints
                }

                if (processedBlobUrl) URL.revokeObjectURL(processedBlobUrl);
                processedBlobUrl = URL.createObjectURL(blob);
            }

            function setSizeBadgeState(color, status) {
                if (color === 'red') {
                    sizeBadge.className = 'px-2 py-1 rounded-full bg-red-100 text-red-700 font-medium';
                    downloadBtn.disabled = true;
                } else {
                    sizeBadge.className = 'px-2 py-1 rounded-full bg-green-100 text-green-800 font-medium border border-green-300';
                    downloadBtn.disabled = false;
                }
                if (currentMode === 'doc') sizeBadge.textContent += ` (${status})`;
            }

            // --- Utilities ---
            function dataURItoBlob(dataURI) {
                const byteString = window.atob(dataURI.split(',')[1]);
                const mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0]
                const ab = new ArrayBuffer(byteString.length);
                const ia = new Uint8Array(ab);
                for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
                return new Blob([ab], {type: mimeString});
            }

            function changeDpiJpegBase64(base64Image, dpi) {
                const dataParts = base64Image.split(',');
                const binaryString = window.atob(dataParts[1]);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);

                let offset = 2; // Skip SOI (FF D8)
                while (offset < bytes.length) {
                    if (bytes[offset] === 0xFF && bytes[offset + 1] === 0xE0) { // APP0 JFIF
                        const identifier = String.fromCharCode(bytes[offset+4], bytes[offset+5], bytes[offset+6], bytes[offset+7], bytes[offset+8]);
                        if (identifier === "JFIF\0") {
                            bytes[offset + 11] = 1; // Dots per inch
                            bytes[offset + 12] = (dpi >> 8) & 0xFF; bytes[offset + 13] = dpi & 0xFF; // X
                            bytes[offset + 14] = (dpi >> 8) & 0xFF; bytes[offset + 15] = dpi & 0xFF; // Y
                            break;
                        }
                    } else if (bytes[offset] === 0xFF && bytes[offset + 1] === 0xDA) { // SOS
                        break;
                    }
                    const markerLen = (bytes[offset + 2] << 8) | bytes[offset + 3];
                    offset += 2 + markerLen;
                }

                let newBinaryString = '';
                for (let j = 0; j < bytes.length; j++) newBinaryString += String.fromCharCode(bytes[j]);
                return dataParts[0] + ',' + window.btoa(newBinaryString);
            }
            
            // Init default state
            setMode('doc');
        });
    </script>
</body>
</html>
